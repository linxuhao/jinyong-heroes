# One play-test scenario. Loaded by playtest/_common.yaml's sibling scan —
# scene / actions / surface live there, this file is only the scenario.
# The basename must equal `name:`.
#
# Commit lock (出手即锁定): a successful action locks the turn's movement — no
# more undo. Walk up three tiles to (7,2) (adjacent to Central_Divine at
# (7,1)), then click Central_Divine_ClickTarget -> basic attack 30 x fa_hui_du
# 1.3 = 39 damage. Player.acted false->true at f110 is the changed differential
# (the click executed the action); the equality + health assert land at f140.
# Central_Divine.health == max_health - 39 is a PROBE number (same convention
# as click_targeting_fixed — recalibrate the 39 to observed if a run
# disagrees, but do not change the assert structure). Then Player +0,0 right:
# undo is REFUSED because acted == true — grid_pos stays (7,2) (NOT back to
# (7,5)), moves_left stays 1, undo_available false.
name: click_move_commit_lock
description: >-
  Commit lock: walk to (7,2), click Central_Divine_ClickTarget -> basic attack
  30 * 1.3 = 39 (Player.acted false->true; Central_Divine.health == max_health
  - 39 PROBE), then right-click the player's own tile: undo is REFUSED
  (acted == true) — grid_pos stays (7,2), moves_left stays 1, undo_available
  false. Commit kills the undo affordance, not the movement rule.
timeline:
- at: 3
  actions:
  - ui_accept
- at: 5
  actions:
  - ui_accept
- at: 7
  actions:
  - ui_accept
- at: 9
  actions:
  - ui_accept
- at: 11
  actions:
  - ui_accept
- at: 13
  actions:
  - ui_accept
- at: 15
  actions:
  - ui_accept
- at: 20
  actions:
  - tutorial_next
- at: 25
  actions:
  - tutorial_next
- at: 30
  actions:
  - tutorial_next
- at: 40
  actions: []
  clicks:
  - Player +0,-192
- at: 45
  actions: []
  assert:
    Player.grid_pos: changed
- at: 100
  actions: []
  assert:
    Player.grid_pos: grid_pos == Vector2i(7, 2)
    Player.moves_left: moves_left == 1
- at: 105
  actions: []
  clicks:
  - Central_Divine_ClickTarget
- at: 110
  actions: []
  assert:
    Player.acted: changed
- at: 140
  actions: []
  assert:
    Player.acted: acted == true
    Central_Divine.health: health == max_health - 39  # PROBE
- at: 145
  actions: []
  clicks:
  - Player +0,0 right
- at: 175
  actions: []
  assert:
    Player.grid_pos: grid_pos == Vector2i(7, 2)
    Player.moves_left: moves_left == 1
    Player.undo_available: undo_available == false
