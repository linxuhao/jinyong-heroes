# One play-test scenario. Loaded by playtest/_common.yaml's sibling scan —
# scene / actions / surface live there, this file is only the scenario.
# The basename must equal `name:`.
#
# Commit lock (出手即锁定): a successful action locks the turn's movement — no
# more undo. Walk up ONE tile to (7,4) (adjacent to Central_Divine at (7,3)),
# then click Central_Divine_ClickTarget -> basic attack 30 x fa_hui_du
# 1.3 = 39 damage. Player.acted false->true at f145 is the changed differential
# (the click executed the action; execute_action latency is 40 frames, proven
# by click_targeting_fixed); the equality + health assert land at f150.
# Central_Divine.health == max_health - 39 is a PROBE number (same convention
# as click_targeting_fixed — recalibrate the 39 to observed if a run
# disagrees, but do not change the assert structure). Then Player +0,0 right:
# undo is REFUSED because acted == true — grid_pos stays (7,4) (NOT back to
# (7,5)), moves_left stays 3, undo_available false.
# CHANGED due to rule F1 — valid rows 3..10 (spawns moved + rows 0..2 excluded):
# (7,2) is no longer reachable and Central_Divine now sits at (7,3); the player
# stops at the furthest reachable legal empty tile (7,4), still Chebyshev 1 away.
name: click_move_commit_lock
description: >-
  Commit lock: walk to (7,4), click Central_Divine_ClickTarget -> basic attack
  30 * 1.3 = 39 (Player.acted false->true; Central_Divine.health == max_health
  - 39 PROBE), then right-click the player's own tile: undo is REFUSED
  (acted == true) — grid_pos stays (7,4), moves_left stays 3, undo_available
  false. Commit kills the undo affordance, not the movement rule.
timeline:
- at: 3
  actions:
  - ui_accept
- at: 5
  actions:
  - ui_accept
- at: 7
  actions:
  - ui_accept
- at: 9
  actions:
  - ui_accept
- at: 11
  actions:
  - ui_accept
- at: 13
  actions:
  - ui_accept
- at: 15
  actions:
  - ui_accept
- at: 20
  actions:
  - tutorial_next
- at: 25
  actions:
  - tutorial_next
- at: 30
  actions:
  - tutorial_next
- at: 40
  actions: []
  clicks:
  - Player +0,-64
- at: 45
  actions: []
  assert:
    Player.grid_pos: changed
- at: 100
  actions: []
  assert:
    Player.grid_pos: grid_pos == Vector2i(7, 4)
    Player.moves_left: moves_left == 3
- at: 105
  actions: []
  clicks:
  - Central_Divine_ClickTarget
- at: 145
  actions: []
  assert:
    Player.acted: changed
- at: 150
  actions: []
  assert:
    Player.acted: acted == true
    Central_Divine.health: health == max_health - 39  # PROBE
- at: 155
  actions: []
  clicks:
  - Player +0,0 right
- at: 185
  actions: []
  assert:
    Player.grid_pos: grid_pos == Vector2i(7, 4)
    Player.moves_left: moves_left == 3
    Player.undo_available: undo_available == false
