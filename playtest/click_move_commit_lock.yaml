# One play-test scenario. Loaded by playtest/_common.yaml's sibling scan —
# scene / actions / surface live there, this file is only the scenario.
# The basename must equal `name:`.
#
# Commit lock (出手即锁定): a successful action locks the turn's movement — no
# more undo. Spawns are restored (rows 1..9 legal, Central_Divine (7,1)), so
# walk NORTH 3 tiles: Player +0,-192. TILE_SIZE = 64, feet world y = 32 + 64*r
# (row 5 = 352, row 2 = 160) => 3 * 64 = 192 px up column 7 to (7,2), all
# intermediate tiles empty and none on the border ring (is_walkable blocks only
# rows/cols 0 and GRID_*-1). Chebyshev(max(|7-7|, |2-1|)) = 1 — (7,2) is one of
# the nearest legal tiles adjacent to Central_Divine (7,1), so the attack is IN
# reach. Turn budget is 4 steps, so after 3 moves moves_left == 4 - 3 == 1.
# Click Central_Divine (the enemy's own Node2D body origin / feet tile) ->
# basic attack 30 x fa_hui_du 1.3 = 39
# damage vs Central_Divine.max_health 130. Player.acted false->true at f145 is
# the changed differential (the click executed the action; execute_action
# latency is 40 frames, proven by click_targeting_fixed); the equality + health
# assert land at f150. Central_Divine.health == max_health - 39 is a PROBE
# number (same convention as click_targeting_fixed — recalibrate the 39 to
# observed if a run disagrees, but do not change the assert structure). Then
# Player +0,0 right: undo is REFUSED because acted == true — grid_pos stays
# (7,2) (NOT back to (7,5)), moves_left stays 1, undo_available false.
name: click_move_commit_lock
description: >-
  Commit lock: walk north 3 tiles (7,5)->(7,2) [Player +0,-192, 3 steps of a
  4-step budget], click Central_Divine (the enemy's own Node2D body origin /
  feet tile) -> basic attack 30 * 1.3 =
  39 (Player.acted false->true; Central_Divine.health == max_health - 39
  PROBE), then right-click the player's own tile: undo is REFUSED (acted ==
  true) — grid_pos stays (7,2), moves_left stays 1, undo_available false.
  Commit kills the undo affordance, not the movement rule.
timeline:
- at: 3
  actions:
  - ui_accept
- at: 5
  actions:
  - ui_accept
- at: 7
  actions:
  - ui_accept
- at: 9
  actions:
  - ui_accept
- at: 11
  actions:
  - ui_accept
- at: 13
  actions:
  - ui_accept
- at: 15
  actions:
  - ui_accept
- at: 20
  actions:
  - tutorial_next
- at: 25
  actions:
  - tutorial_next
- at: 30
  actions:
  - tutorial_next
- at: 40
  actions: []
  clicks:
  - Player +0,-192
- at: 45
  actions: []
  assert:
    Player.grid_pos: changed
- at: 100
  actions: []
  assert:
    Player.grid_pos: grid_pos == Vector2i(7, 2)
    Player.moves_left: moves_left == 1
- at: 105
  actions: []
  clicks:
  - Central_Divine
- at: 145
  actions: []
  assert:
    Player.acted: changed
- at: 150
  actions: []
  assert:
    Player.acted: acted == true
    Central_Divine.health: health == max_health - 39  # PROBE
- at: 155
  actions: []
  clicks:
  - Player +0,0 right
# NOTE — the f185 `undo_available == false` assert is ambiguous on its own: the
# false value alone does not distinguish "an action committed, so the undo was
# refused" (the case this timeline proves) from "there was never anything to
# undo". In the stale pre-rebase timeline — a one-tile +0,-64 walk to the tile
# adjacent to Central_Divine's *then* spawn — this same assert was green only
# because, with spawns restored, that old walk left the player Chebyshev-3 from
# Central_Divine: the attack click was out of reach, acted stayed false, the
# f155 right-click lawfully UNDID the move and refunded the action points, and
# undo_available read false because nothing was left to undo — NOT because
# committing had refused an undo. Here the false is pinned to the committed
# cause by the co-asserts on this line: grid_pos still == (7,2) and moves_left
# still == 1. A lawful undo would have snapped the player back to its pre-move
# tile (7,5) with the full step budget back; that the snapshot still shows
# (7,2)
# / 1 is what proves the refusal, not the undo_available value itself.
- at: 185
  actions: []
  assert:
    Player.grid_pos: grid_pos == Vector2i(7, 2)
    Player.moves_left: moves_left == 1
    Player.undo_available: undo_available == false
