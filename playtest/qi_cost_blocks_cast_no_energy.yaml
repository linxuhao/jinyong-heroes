# One play-test scenario. Loaded by playtest/_common.yaml's sibling scan —
# scene / actions / surface live there, this file is only the scenario.
# The basename must equal `name:`.
name: qi_cost_blocks_cast_no_energy
description: >-
  Real-battle proof that casting spends inner qi and that insufficient qi
  blocks the move (jinyong-spend-qi). A real skill_2 (大巧不工, cost > 0) cast
  deducts the pool (energy < energy_max, acted, still round 1); after
  debug_spend_player_qi drains the pool to 0 through the shared spend path,
  button 4 (array index 3, never phase-locked, never cast, no HP gate) enters
  no_energy - NOT phase_locked - and is disabled; the hotkey select is refused
  with the visible reason 内力不足 and selection is unchanged; a confirm
  attempt consumes nothing (energy stays 0, no cooldown started). Button 1
  (重剑无锋) is this round's free move in the cost table (its own cost-table
  pin, see 20_content.md §7.3) - it is NOT the never-disarmed guarantee; that
  belongs to the basic attack (普攻, cost 0, unconditionally available at 0
  qi, see design/90_decisions.md). The scenario ends round 1 with one
  end_turn: in round 2 the pool is still 0 and no skill is selected, so a
  single attack_confirm fires the basic attack at zero cost - the
  never-disarmed negative control (acted set, energy still 0, confirming it
  was a basic attack, not a skill).
timeline:
- at: 3
  actions:
  - ui_accept
- at: 5
  actions:
  - ui_accept
- at: 7
  actions:
  - ui_accept
- at: 9
  actions:
  - ui_accept
- at: 11
  actions:
  - ui_accept
- at: 13
  actions:
  - ui_accept
- at: 15
  actions:
  - ui_accept
- at: 30
  actions: []
  assert:
    Player.energy: 'energy == energy_max'
    SkillButton4.state_text: 'state_text != "no_energy"'
    SkillButton4.disabled: 'disabled == false'
- at: 46
  actions:
  - move_up
- at: 61
  actions:
  - move_up
- at: 76
  actions:
  - move_up
- at: 91
  actions:
  - skill_2
- at: 106
  actions:
  - attack_confirm
- at: 150
  actions: []
  assert:
    Player.energy: 'energy < energy_max'
    Player.acted: 'acted == true'
    CombatManager.current_round: 'current_round == 1'
- at: 170
  actions:
  - debug_spend_player_qi
- at: 240
  actions: []
  assert:
    Player.energy: 'energy >= 0 and energy < energy_max'
    SkillButton4.state_text: 'state_text == "no_energy" and state_text != "phase_locked"'
    SkillButton4.disabled: 'disabled == true'
    SkillButton4.state_tag_text: 'state_tag_text == "内力不足"'
    SkillButton1.disabled: 'disabled == false'
    SkillButton1.state_text: 'state_text == "ready"'
- at: 260
  actions:
  - skill_4
- at: 280
  actions: []
  assert:
    ActionHintLabel.text: 'text == "内力不足"'
    Player.selected_skill_index: 'selected_skill_index != 3'
- at: 300
  actions:
  - attack_confirm
- at: 360
  actions: []
  assert:
    Player.energy: 'energy == 0'
    SkillButton4.cooldown_remaining: 'cooldown_remaining == 0'
    SkillButton4.state_text: 'state_text == "no_energy"'
- at: 400
  actions:
  - end_turn
- at: 950
  actions: []
  assert:
    CombatManager.current_round: 'current_round == 2'
    Player.acted: 'acted == false'
    Player.energy: 'energy == 0'
- at: 960
  actions:
  - move_right
- at: 975
  actions:
  - move_right
- at: 1000
  actions:
  - attack_confirm
- at: 1100
  actions: []
  assert:
    Player.acted: 'acted == true'
    Player.energy: 'energy == 0'
    Player.selected_skill_index: 'selected_skill_index == -1'
