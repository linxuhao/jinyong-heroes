# One play-test scenario. Loaded by playtest/_common.yaml's sibling scan —
# scene / actions / surface live there, this file is only the scenario.
# The basename must equal `name:`.
#
# UX-02 affordance gate: the MoveHintLabel below the player's feet must tell the
# player 左键移动 / 右键退回 / 出手即确认, and its copy must FOLLOW the move
# state machine — never showing a promise that no longer holds. Frame timings
# reuse the proven click_move_undo_right / click_move_commit_lock numbers:
#   walk click f70 -> settled f130 (grid (7,2), undo_available, state undo_ready)
#   undo click f135 -> settled f170 (back to (7,5), state idle again)
#   second walk f175 -> f230 (grid (7,2), undo_ready again)
#   Central_Divine (enemy's Node2D body origin / feet tile) f235 -> f290 (acted,
#   commit locks undo, committed)
# Each MoveHintLabel.assert carries a comparison operator (repo discipline — no
# bare-scalar silent-false asserts).
name: move_target_affordance
timeline:
- {at: 3, actions: [ui_accept]}
- {at: 5, actions: [ui_accept]}
- {at: 7, actions: [ui_accept]}
- {at: 9, actions: [ui_accept]}
- {at: 11, actions: [ui_accept]}
- {at: 13, actions: [ui_accept]}
- {at: 15, actions: [ui_accept]}
- {at: 20, actions: [tutorial_next]}
- {at: 25, actions: [tutorial_next]}
- {at: 30, actions: [tutorial_next]}
- at: 45
  actions: []
  assert:
    MoveHintLabel.state: state == "idle"
    MoveHintLabel.text: text.contains("左键") == true
    MoveHintLabel.visible: visible == true
    MoveHintLabel.in_viewport: in_viewport == true
- at: 70
  actions: []
  clicks:
  - Player +0,-192
- at: 130
  actions: []
  assert:
    Player.grid_pos: grid_pos == Vector2i(7, 2)
    MoveHintLabel.state: state == "undo_ready"
    MoveHintLabel.text: text.contains("右键") == true
    MoveHintLabel.bar_overlap: bar_overlap == false
    MoveHintLabel.in_viewport: in_viewport == true
- at: 135
  actions: []
  clicks:
  - Player +64,0 right
- at: 170
  actions: []
  assert:
    Player.grid_pos: grid_pos == Vector2i(7, 5)
    MoveHintLabel.state: state == "idle"
- at: 175
  actions: []
  clicks:
  - Player +0,-192
- at: 230
  actions: []
  assert:
    Player.grid_pos: grid_pos == Vector2i(7, 2)
    MoveHintLabel.state: state == "undo_ready"
- at: 235
  actions: []
  clicks:
  - Central_Divine
- at: 290
  actions: []
  assert:
    Player.acted: acted == true
    Player.undo_available: undo_available == false
    MoveHintLabel.state: state == "committed"
    MoveHintLabel.text: text.contains("已出手") == true
    MoveHintLabel.visible: visible == true
