# One play-test scenario. Loaded by playtest/_common.yaml's sibling scan —
# scene / actions / surface live there, this file is only the scenario.
# The basename must equal `name:`.
name: dot_resolves_at_victim_turn_start
description: 'Fixture-driven DoT contract (branch b — the premise is INJECTED, never AI-applied): debug_poison_player applies Spirit Serpent poison on the player''s round-1 turn (stored tick round(8*1.3)=10, 2 rounds) and the first asserted behavior is that poison IS applied (f40). Tick #1 resolves at the VICTIM''s own turn start — the first PLAYER_TURN frame after the round-1 enemy phase (f250): health 310 -> 326 = -10 tick +26 神雕之力 regen (regen fires after the tick, design/10_systems.md §5.2), rounds 2 -> 1, poison still present. Tick #2 resolves at the round-3 turn start (f370): rounds 1 -> 0, poison removed, health 291. Deterministic zero-RNG line; HP pins read from the probe run.'
timeline:
- at: 3
  actions:
  - ui_accept
- at: 5
  actions:
  - ui_accept
- at: 7
  actions:
  - ui_accept
- at: 9
  actions:
  - ui_accept
- at: 11
  actions:
  - ui_accept
- at: 13
  actions:
  - ui_accept
- at: 15
  actions:
  - ui_accept
- at: 20
  actions:
  - debug_poison_player
- at: 40
  actions: []
  assert:
    Player.status_names: status_names.has("poison") == true
- at: 60
  actions:
  - end_turn
- at: 250
  actions: []
  assert:
    CombatManager.phase: phase == "PLAYER_TURN"
    Player.status_names: status_names.has("poison") == true
    Player.health: health == 326
- at: 270
  actions:
  - end_turn
- at: 370
  actions: []
  assert:
    Player.status_names: status_names.has("poison") == false
    Player.health: health == 291
