# One play-test scenario. Loaded by playtest/_common.yaml's sibling scan —
# scene / actions / surface live there, this file is only the scenario.
# The basename must equal `name:`.
name: dot_resolves_at_victim_turn_start
description: "TEMPORARY DIAGNOSTIC (to be replaced) — sweep round/phase/active/health/poison/grid to locate F_a (West Poison applies 灵蛇缠身) and F_t (player's next turn start / poison tick)."
timeline:
- at: 3
  actions:
  - ui_accept
- at: 5
  actions:
  - ui_accept
- at: 7
  actions:
  - ui_accept
- at: 9
  actions:
  - ui_accept
- at: 11
  actions:
  - ui_accept
- at: 13
  actions:
  - ui_accept
- at: 15
  actions:
  - ui_accept
# The player walks into West Poison's approach lane (right x2, up x2 -> (9,3))
# in round 1 so WP reaches adjacency in rounds 3-4 and applies 灵蛇缠身 there,
# before the five enemies can pile damage on. end_turn is IGNORED during enemy
# turns and the player's turn waits forever, so one press every ~50 frames
# guarantees every player turn is ended and the battle never stalls.
- at: 20
  actions:
  - move_right
- at: 32
  actions:
  - move_right
- at: 44
  actions:
  - move_up
- at: 56
  actions:
  - move_up
- at: 70
  actions:
  - end_turn
- at: 120
