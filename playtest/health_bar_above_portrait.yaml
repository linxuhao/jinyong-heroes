# One play-test scenario. Loaded by playtest/_common.yaml's sibling scan —
# scene / actions / surface live there, this file is only the scenario.
# The basename must equal `name:`.
#
# Defect B visual half (2026-08-28): the nameplate now reads as belonging to
# the portrait (bar bottom sits 4 px above sprite_top) instead of on the legs,
# and a ground marker under the feet keeps the occupied tile readable after the
# nameplate moves up. All bar-vs-portrait relations are written on the UNIT
# surface (portrait_bar_pos + sprite_top), never cross-surface, because assert
# expressions see only one surface block. The widget height 24 (68x24) is the
# measured children sum (NameLabel 12 + Bar 12) from health_bar.gd's
# _relayout_children() — the widget contains its own children.
#
# The single-surface scoping: Player carries sprite_top and portrait_bar_pos;
# Central_Divine and West_Poison carry theirs; the HealthBar block (the PLAYER's
# bar) only self-compares. Enemy start tiles cross-checked against
# scripts/battlefield.gd: Player (7,5) feet 352 sprite_top 224; Central_Divine
# (7,1) feet world y = 32 + 64 = 96 -> sprite_top = 96 - 128 = -32 (NEGATIVE —
# foot-anchored sprite, ink extends UP from the feet); West_Poison (11,2) feet
# = 32 + 128 = 160 -> sprite_top = 160 - 128 = 32. Because sprite_top is below
# the flip threshold STRIP_BOTTOM + 2 = 94, the above-portrait anchor
# (sprite_top - 4 - 24 = -60 / 4) would sit inside or over the top strip, so the
# bar is FLIPPED to the far side of the portrait: its TOP anchors 4 px below the
# portrait ink bottom (portrait_ink_rect.end.y + 4 = feet + 4 = 100 for
# Central_Divine, 164 for West_Poison) — sitting on the unit's OWN tile, the
# truthful "stands here" statement.
#
# The click leg supplies the required differential: walk up one tile then retreat
# (feet right-click), so the positional asserts are re-evaluated with the player
# back at (7,5) (mid-board).
name: health_bar_above_portrait
description: >-
  The nameplate sits above the portrait top and a ground marker marks each
  occupied tile. Mid-board player (7,5): sprite_top > 100 and the bar bottom is
  >= 4 px above sprite_top (normal above-anchor, bar_anchors_below_portrait ==
  false). Top-row Central_Divine (7,1) (sprite_top = 96 - 128 = -32,
  negative) and West_Poison (11,2) (sprite_top = 160 - 128 = 32) FLIP to the far
  side of the portrait: their bar top sits at portrait_ink_bottom + 4 = feet + 4
  (100 and 164) — strictly below sprite_top + PORTRAIT_TEX_Y (bar_top >
  sprite_top + 128), bar_anchors_below_portrait true. TileMarkers.
  tile_marker_count == 6 (player + five Greats) and tile_marker_visible == true.
  A walk-then-retreat click leg carries the differential assert.
timeline:
- at: 3
  actions:
  - ui_accept
- at: 5
  actions:
  - ui_accept
- at: 7
  actions:
  - ui_accept
- at: 9
  actions:
  - ui_accept
- at: 11
  actions:
  - ui_accept
- at: 13
  actions:
  - ui_accept
- at: 15
  actions:
  - ui_accept
- at: 20
  actions:
  - tutorial_next
- at: 25
  actions:
  - tutorial_next
- at: 30
  actions:
  - tutorial_next
- at: 40
  actions: []
  clicks:
  - Player +0,-64
- at: 90
  actions: []
  assert:
    Player.grid_pos: grid_pos == Vector2i(7, 4)
    Player.debug_input_events: changed
- at: 95
  actions: []
  clicks:
  - Player +0,0 right
- at: 140
  actions: []
  assert:
    Player.grid_pos: grid_pos == Vector2i(7, 5)
    Player.moves_left: moves_left == 4
- at: 200
  actions: []
  assert:
    Player.grid_pos: grid_pos == Vector2i(7, 5)
    Player.sprite_top: sprite_top > 100.0
    Player.portrait_bar_pos: sprite_top - (portrait_bar_pos.y + 24.0) >= 4.0
    HealthBar.bar_top: bar_top > 94.0
    HealthBar.bar_bottom: bar_bottom > bar_top
    HealthBar.bar_anchors_below_portrait: bar_anchors_below_portrait == false
    Central_Divine.portrait_bar_pos: portrait_bar_pos.y > sprite_top + 128.0
    West_Poison.portrait_bar_pos: portrait_bar_pos.y > sprite_top + 128.0
    TileMarkers.tile_marker_count: tile_marker_count == 6
    TileMarkers.tile_marker_visible: tile_marker_visible == true
