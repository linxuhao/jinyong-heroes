# One play-test scenario. Loaded by playtest/_common.yaml's sibling scan —
# scene / actions / surface live there, this file is only the scenario.
# The basename must equal `name:`.
#
# C7 WORK-BEATS-IDLING RATIO NAIL (R3b, 2026-09-02).
#
# Proves the work economy pulls meaningfully ahead of the free-card/idle
# baseline WITHOUT touching any balance literal: 36 months of 做工 (work) must
# end with STRICTLY MORE than 1.5x the silver of a 36-month idle run from the
# SAME seed. Ratio pin (final_silver > first_ending_silver * 3 / 2), no absolutes.
#
#   Leg A (idle): seed a fresh CULTIVATION save, load it, debug_fast_forward
#     through all 36 months (no 做工) -> map -> kunlun -> ENDING. The FIRST
#     ending records SaveManager.first_ending_silver (the idle baseline).
#   Leg B (work-heavy): restart -> re-seed the SAME seed -> load -> 36 work
#     months by the clicks-only grammar -> map -> kunlun -> ENDING. Assert the
#     ending's own silver DIFFERS from the idle baseline by the 1.5x margin.
#
# Zero new RNG, zero card-data change: the work compounding curve
# (work_income = 10 + 3 * work_months, C7) is what widens the ratio.
#
# RED-FIRST (measured on the pre-C7 tree where work_income was 10 + 2*mastered
#   and idle card silver dominated): the ratio landed ~1.12 — the assertion
#   `final_silver > first_ending_silver * 3 / 2` was RED (observed ratio ~1.1).
name: work_beats_idling
description: >-
  36 work months end with more than 1.5x the silver of 36 idle months from the
  same seed. Leg A: fast-forward idle run to ENDING (captures
  first_ending_silver). Leg B: restart, re-seed same seed, 36 clicked work
  months to ENDING (final_silver > first_ending_silver * 3 / 2, a RATIO pin,
  zero absolute silver). Every touched ENDING frame: UiOcclusionWatch clean.
scene: res://scenes/menu.tscn
timeline:
# ── LEG A (idle): seed a fresh save, load it, fast-forward 36 months ────────
- at: 10
  actions:
  - debug_delete_save
- at: 40
  actions:
  - debug_seed_save
- at: 70
  actions:
  - move_down
- at: 90
  actions:
  - ui_accept
- at: 130
  actions: []
  assert:
    GameManager.current_state: current_state == "CULTIVATION"
    CultivationScreen.phase: phase == "CARD_PICK"
    CultivationScreen.month: month == 1
- at: 150
  actions:
  - debug_fast_forward
- at: 300
  actions: []
  assert:
    GameManager.current_state: current_state == "MAP"
# ── Walk to kunlun (endpoint -> ENDING), the map-node click grammar ──────────
- at: 320
  actions: []
  clicks:
  - TravelButton0
- at: 330
  actions: []
  clicks:
  - EventOptionButton0
- at: 340
  actions: []
  clicks:
  - TravelButton1
- at: 350
