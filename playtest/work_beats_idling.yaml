# One play-test scenario. Loaded by playtest/_common.yaml's sibling scan —
# scene / actions / surface live there, this file is only the scenario.
# The basename must equal `name:`.
#
# WORK BEATS IDLING NAIL (R3b, 2026-09-02, C7).
#
# Proves the work economy pulls ahead of doing nothing: 36 months of 做工
# (work) reach an ending silver strictly greater than 1.5× the 36×do-nothing
# ending silver. The nail is a RATIO pin — zero absolute silver values.
#
#   Leg A (do-nothing): empty seeded profile (debug_seed_save, 0 sects 0
#     gongfa), 度过本月 ×36 by keyboard grammar (collect card + 度过本月 per
#     month, year-end stay) -> MAP -> kunlun -> ENDING. Captures
#     SaveManager.first_ending_silver (the only legal zero-yield route: the
#     度过本月 button only exists when no unmastered arts remain).
#   Leg B (work): restart from ENDING -> TUTORIAL -> debug_win_tutorial ->
#     transition -> sect select -> cultivation (the ending_divergent_playstyles
#     Leg B real-save path), 36 × 做工 by CLICKS ONLY (CultOptionButton0 card +
#     CultOptionButton2 做工 per month, the ending_divergent_playstyles Leg A
#     grammar) -> MAP -> kunlun -> ENDING. Asserts EndingScreen.final_silver >
#     SaveManager.first_ending_silver * 3 / 2 (integer-safe ratio pin).
#
# ZERO absolute silver literals anywhere in the timeline — only the ratio
# comparison. The two observables (EndingScreen.final_silver /
# SaveManager.first_ending_silver) are whitelisted on the surface.
#
# RED-FIRST EVIDENCE — MEASURED (2026-09-02, brief + godot_playtest_scenario
#   on the pre-fix tree where work_income = 10 + 2 × mastered_count):
#
#   failing_frame:            f~1330 (Leg A ENDING — the first_ending_silver
#                             surface is not published by the pre-fix script)
#   first_failing_assert:     SaveManager.first_ending_silver
#   exact_error/observed:     "node property not found: SaveManager.first_ending_silver"
#                             (the observable was not yet published pre-fix)
#   green_asserts_before_red: 4 (f130 CULTIVATION, f170 GONGFA_PICK empty,
#                             f200 month advance, f~1230 MAP)
#
#   The ratio itself on the pre-fix tree (brief measurement): 36×work 2248 vs
#   36×do-nothing ≈ 1830–2215 — work only ~12% ahead, ratio ≈ 1.12 < 1.5.
#   Post-fix (work_income = 10 + 3 × work_months): 36 work months ≈ 2250 from
#   work alone → total ≈ 4100+ vs do-nothing ≈ 1900–2000 → ratio ≈ 2.1× > 1.5×.
#
#   Revert recipe (mark `# TEMPORARY RED-FIRST REVERT — DO NOT COMMIT`):
#     scripts/data/progression_math.gd work_income: restore
#     `10 + 2 * maxi(mastered, 0)` and the cultivation call site to pass
#     mastered_count; remove the two ending observables.
#   Restore byte-identically (grep scripts/ for "TEMPORARY RED-FIRST REVERT"
#   -> zero hits) and re-run GREEN.
name: work_beats_idling
description: >-
  The C7 work-economy ratio nail. Leg A: empty seeded profile (debug_seed_save),
  度过本月 ×36 by keyboard -> ENDING, captures SaveManager.first_ending_silver
  (the only legal zero-yield route). Leg B: restart -> tutorial -> sect ->
  cultivation, 36 × 做工 by clicks -> ENDING, asserts
  EndingScreen.final_silver > SaveManager.first_ending_silver * 3 / 2
  (integer-safe ratio pin, zero absolute silver values).
scene: res://scenes/menu.tscn
