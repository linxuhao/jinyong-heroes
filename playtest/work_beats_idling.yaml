    SaveManager.first_ending_silver: first_ending_silver >= 0
    UiOcclusionWatch.violations: violations == 0
    UiOcclusionWatch.scan_ok: scan_ok == true
# ── LEG B (work-heavy): restart -> real boot (tutorial win -> creation -> sect)
