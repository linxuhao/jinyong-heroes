# One play-test scenario. Loaded by playtest/_common.yaml's sibling scan —
# scene / actions / surface live there, this file is only the scenario.
# The basename must equal `name:`.
#
# R5 C3 (cultivation back channel): SECT_SWITCH backs to its previous step
# YEAR_END with ZERO state delta. Drive to month 12's YEAR_END, move_down ×1 (另投他派),
# ui_accept -> SECT_SWITCH. Click CultBackButton -> YEAR_END, month/silver unchanged.
#
# RED-FIRST four values (measured on pre-implementation tree — no back channel):
#   pre-fix failing frame ........ 690 (the first SECT_SWITCH assert frame)
#   first failing assert ......... CultivationScreen.back_button_visible == true —
#                                  the pre-fix tree never published the var.
#   exact error .................. surface var absent (back_button_visible == false)
#   green asserts before red ..... 4 (phase + month + back + consequence pass)
name: back_button_sect_switch_zero_delta
description: >-
  C3 back from SECT_SWITCH: YEAR_END 另投他派 -> SECT_SWITCH shows back_button_visible
  true / back_target_phase "YEAR_END"; clicking CultBackButton returns to YEAR_END
  with month == 12 and silver == silver_before_accept (zero delta). CultBackButton
  hidden after back.
scene: res://scenes/menu.tscn
