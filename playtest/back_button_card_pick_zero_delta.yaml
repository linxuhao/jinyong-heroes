# One play-test scenario. Loaded by playtest/_common.yaml's sibling scan —
# scene / actions / surface live there, this file is only the scenario.
# The basename must equal `name:`.
#
# R5 C3 (cultivation back channel): CARD_PICK gets a visible BackButton + ui_cancel
# returning to ACTION_PICK with ZERO state delta. Unlike a commit (which applies the
# month's staged card and enters ACTION_PICK for the action), backing out simply
# declines the pick and lands on ACTION_PICK WITHOUT applying the card — month and
# silver unchanged (differential read month_before_accept / silver_before_accept).
#
# Boot: debug_seed_save + load (no-sect empty profile, month 1) -> CARD_PICK.
# Click CultBackButton -> ACTION_PICK, assert month/silver zero delta.
#
# RED-FIRST four values (measured on pre-implementation tree — no back channel):
#   pre-fix failing frame ........ 160 (the first back-assert frame)
#   first failing assert ......... CultivationScreen.back_button_visible == true —
#                                  the pre-fix tree never published the var.
#   exact error .................. surface var absent (back_button_visible == false)
#   green asserts before red ..... 3 (state + phase + month checks pass)
name: back_button_card_pick_zero_delta
description: >-
  C3 back from CARD_PICK: the monthly card screen shows back_button_visible true /
  back_target_phase "ACTION_PICK"; clicking CultBackButton returns to ACTION_PICK
  with month == month_before_accept and silver == silver_before_accept (zero delta,
  no staged card applied). CultBackButton hidden after back.
scene: res://scenes/menu.tscn
timeline:
# ── MENU: seed a fresh no-sect CULTIVATION save ────────────────────────────
- at: 10
  actions:
  - debug_delete_save
- at: 40
  actions:
  - debug_seed_save
- at: 70
  actions:
  - move_down
- at: 90
  actions:
  - ui_accept
# ── LOAD -> CULTIVATION (no-sect fresh profile, month 1, CARD_PICK) ────────
- at: 130
  actions: []
  assert:
    GameManager.current_state: current_state == "CULTIVATION"
    CultivationScreen.phase: phase == "CARD_PICK"
    CultivationScreen.month: month == 1
    CultivationScreen.back_button_visible: back_button_visible == true
    CultivationScreen.back_target_phase: back_target_phase == "ACTION_PICK"
# ── BACK: click CultBackButton -> ACTION_PICK, zero delta ──────────────────
- at: 140
  actions: []
  clicks:
  - CultBackButton
- at: 170
  actions: []
  assert:
    CultivationScreen.phase: phase == "ACTION_PICK"
    CultivationScreen.month: month == month_before_accept
    CultivationScreen.silver: silver == silver_before_accept
    CultivationScreen.back_button_visible: back_button_visible == false
