  year-end resolves, then differ ONLY in the month-36 action: leg A 做工, leg B
  练功. Both route to ENDING; the evaluation record DIFFERS across the legs
  (EndingScreen.diverged_from_first == true). Every touched ENDING
  frame: UiOcclusionWatch clean. ZERO balance literals.
