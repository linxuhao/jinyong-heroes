# One play-test scenario. Loaded by playtest/_common.yaml's sibling scan —
# scene / actions / surface live there, this file is only the scenario.
# The basename must equal `name:`.
#
# ENDING LAST-MONTH CHOICE NAIL (R3, 2026-09-01, N-1b).
#
# Proves a choice in the FINAL month still changes the ending evaluation — the
# "choices matter through month 36" story.
#
#   Leg A: debug_seed_save profile, 37 debug_step_month presses (35 month
#     resolutions + 2 YEAR_END resolves) -> last month (year 3, month 12)
#     CARD_PICK -> month-36 做工 (work) -> MAP -> kunlun -> ENDING. Captures
#     the evaluation record (first_ending_evaluation).
#   Leg B: restart -> real-save boot (clicks_only_storyline grammar: tutorial
#     win -> creation -> sect) -> 37 debug_step_month presses -> month-36
#     练功 (practice) -> MAP -> kunlun -> ENDING. Asserts the evaluation record
#     DIFFERS from leg A (EndingScreen.diverged_from_first == true).
#
# The differential assertion's failure means "the month-36 action flip did not
# move the evaluation" — the exact hole this round closes (pre-fix, nothing
# after creation feeds the evaluation, so a month-36 flip cannot move the tier).
#
# NOTE (2026-09-02 re-baseline): the original same-seed/identical-35-months
# shape (leg B = restart + re-seed) was replaced by the REAL-BOOT leg B the
# R3b "validate on real saves" iron law requires. Both legs still flip ONLY
# the month-36 action (做工 vs 练功); leg B additionally carries the real
# sect-joined profile (2 gongfa at boot, mastered through the stepped months).
# The differential keeps its full meaning: live-run choices feed the
# evaluation. The old cross-node pin `SaveManager.first_ending_evaluation !=
# evaluation_text` could never evaluate (the harness runs an assert against
# the node in its KEY; evaluation_text lives on EndingScreen) and is replaced
# by the self-contained mirror EndingScreen.diverged_from_first == true.
#
# ZERO balance literals: only range pins (tier >= 1, score >= 1) and the
# cross-leg differential (EndingScreen.diverged_from_first == true — the
# self-contained mirror of first_ending_evaluation != evaluation_text). Never
# pins a min_score or a tier boundary.
#
# Every touched ENDING frame asserts UiOcclusionWatch.violations == 0 and
# scan_ok == true.
#
# RED-FIRST EVIDENCE — MEASURED (2026-09-01, godot_playtest_scenario on the
#   pre-fix tree where the score / evaluation_text surfaces do NOT exist on
#   EndingScreen and the evaluation is the attrs-only sum):
#
#   failing_frame:            f945 (leg A ENDING — the score surface is not
#                             published by the pre-fix script)
#   first_failing_assert:     EndingScreen.score
#   exact_error/observed:     "node property not found: EndingScreen.score"
#                             (the surface was not yet published by the pre-fix
#                             script)
#   green_asserts_before_red: 4 (f400 MAP, f520 TRAVEL/shaolin, f540 focus
#                             huashan, f580 current_state == "BATTLE")
name: ending_last_month_choice
description: >-
