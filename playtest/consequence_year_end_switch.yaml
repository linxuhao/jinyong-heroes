# One play-test scenario. Loaded by playtest/_common.yaml's sibling scan —
# scene / actions / surface live there, this file is only the scenario.
# The basename must equal `name:`.
#
# R5 C1 (cultivation YEAR_END 另投他派): at month 12, YEAR_END offers two rows
# (留在本门 / 另投他派). The consequence renderer composes from
# ProgressionGongfaData.GRADE_BY_YEAR — "保留已学功法；来年授艺品级来自新门派"
# with the next-year grade letter (year 1 -> index 2 = "C" from GRADE_BY_YEAR).
#
# Boot: debug_seed_save + load -> month 1 CARD_PICK. Drive 11 months of
# 做工 (ui_accept card + move_down ×2 + ui_accept action) to reach month 12.
# On month 12's action completion YEAR_END appears. Focus defaults to 0 (留在本门).
# move_down ×1 to focus 1 (另投他派), then assert consequence.
#
# RED-FIRST four values (measured on pre-implementation tree):
#   pre-fix failing frame ........ 640 (first assert frame at YEAR_END)
#   first failing assert ......... CultivationScreen.consequence_text != "" —
#                                  the pre-fix renderer did not exist.
#   exact error .................. surface var absent (consequence_text == "")
#   green asserts before red ..... 1 (phase == "YEAR_END" passes)
name: consequence_year_end_switch
description: >-
  C1 consequence renderer on YEAR_END 另投他派: at month 12, focus 0 shows
  "留在本门" consequence; move to index 1 ("另投他派") changes consequence_text
  to contain "保留" semantics + the next-year grade letter (D/C/B from
  GRADE_BY_YEAR). consequence_matches_focus == true. UiOcclusionWatch clean.
scene: res://scenes/menu.tscn
timeline:
- at: 10
  actions:
  - debug_delete_save
- at: 40
  actions:
  - debug_seed_save
- at: 70
  actions:
  - move_down
- at: 90
  actions:
  - ui_accept
