# One play-test scenario. Loaded by playtest/_common.yaml's sibling scan —
# scene / actions / surface live there, this file is only the scenario.
# The basename must equal `name:`.
name: skill_bar_waiting_state
description: 'The waiting state is presentation-only and visually distinct: after end_turn at frame 130 the engine transitions to ENEMY_TURN, and enemy-turn frames render every button as waiting with a dimmed luma in [0.18, 0.2874] while phase is ENEMY_TURN. Frame 210 sits on a real ENEMY_TURN frame (measured: the engine has already advanced to round 2 there, so the round pin is relaxed to an expression true on any enemy turn while the phase / state_text / state_luma asserts stay authoritative). At the player''s next turn start (frame 500, current_round "changed") state_text is ready again — the override never leaks into player turns.'
timeline:
- at: 3
  actions:
  - ui_accept
- at: 5
  actions:
  - ui_accept
- at: 7
  actions:
  - ui_accept
- at: 9
  actions:
  - ui_accept
- at: 11
  actions:
  - ui_accept
- at: 13
  actions:
  - ui_accept
- at: 15
  actions:
  - ui_accept
- at: 20
  actions:
  - move_up
- at: 35
  actions:
  - move_up
- at: 50
  actions:
  - move_up
- at: 65
  actions:
  - skill_1
- at: 80
  actions:
  - attack_confirm
- at: 120
  actions: []
  assert:
    SkillButton1.state_text: state_text == "cooldown"
- at: 130
  actions:
  - end_turn
- at: 210
  actions: []
  assert:
    CombatManager.phase: phase == "ENEMY_TURN"
    CombatManager.current_round: current_round >= 1
    SkillButton1.state_text: state_text == "waiting"
    SkillButton1.state_luma: state_luma >= 0.18 and state_luma <= 0.2874
- at: 500
  actions: []
  assert:
    CombatManager.current_round: changed
    SkillButton1.state_text: state_text == "ready"
