# One play-test scenario. Loaded by playtest/_common.yaml's sibling scan —
# scene / actions / surface live there, this file is only the scenario.
# The basename must equal `name:`.
name: facility_use_reusable
description: >-
  The facility content type, end to end at 少林 (wuming_valley -> luoyang ->
  shaolin, resolving the intermediate merchant events). The ARRIVAL half is the
  DEFINITIONAL PROPERTY of the content type: event = fires on arrival, facility =
  only an explicit choice enters it. Arriving at 少林 fires the night_rain EVENT
  and does NOT enter a facility — phase stays EVENT (asserted `phase == "EVENT"
  and phase != "FACILITY"`), facility_id stays "", and facility_use_count stays 0
  both at the arrival frame and after the event resolves (resolving an event
  cannot smuggle a facility use in). This negative half is NOT redundancy —
  deleting it deletes what this round established, and the anti-deletion pin in
  tests/test_playtest_contract_smoke.py depends on these two lines surviving.
  The CHOICE half is the positive side: after funding with debug_grant_silver, the
  player's explicit use_facility key enters FACILITY (facility_id ==
  "shaolin_wooden_men", facility_use_count still 0 — entered, not yet used),
  ui_accept uses it once (facility_use_count == 1, silver and attr_bone both
  changed, last_facility_effect_types == ["silver","attr"]), move_down leaves, and
  after travelling away and back the facility is used again (facility_use_count
  == 2, attr_bone changed again) — reusable across visits, observable every use,
  no new economy (silver cost via the shared EventLogic path).
  Two differential nails also pin "using the facility must produce a VISIBLE
  result": at each use frame (at: 600 and at: 790) facility_result_text must be
  non-empty. That var is a published surface observable that stays "" while the
  FACILITY result rendering has not landed yet, so `facility_result_text != ""`
  is RED right now (observed "") — that red is the pre-fix measurement for the
  "facility result is never rendered" defect. (A `changed` differential cannot
  express this red here: the harness's baseline is the frame-0 snapshot, where the
  MapScreen is not yet loaded and reads null, so `changed` is trivially green from
  null -> "".)
