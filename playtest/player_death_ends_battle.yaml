# One play-test scenario. Loaded by playtest/_common.yaml sibling scan —
# scene / actions / surface live there, this file is only the scenario.
# The basename must equal `name:`.
name: player_death_ends_battle
description: >-
  Round invariant: the battle must be ABLE to end. Player death stops the round
  loop, sets LOST with the 战败 overlay, and stays there — never a silently
  continuing BATTLE.

  The premise is INJECTED, not played out. This scenario used to replay a
  2630-frame losing input line to grind the player to 0 HP, which made a LOGIC
  test depend on a BALANCE outcome: the moment Yang Guo was strong enough to
  survive that line, the scenario went red while the logic it guards was still
  perfectly correct. debug_lose_tutorial routes through CombatManager.
  debug_kill_player -> apply_damage, i.e. the same death path a killing enemy
  blow takes, so the classification fields below are exercised exactly as
  before. The kill lands at f620 — MID-BATTLE, after round 1 has fully
  resolved and the player has spent a real turn — so what is under test is that
  an in-flight round loop halts on death, not merely that a fresh battle can be
  aborted.
timeline:
- at: 3
  actions:
  - ui_accept
- at: 5
  actions:
  - ui_accept
- at: 7
  actions:
  - ui_accept
- at: 9
  actions:
  - ui_accept
- at: 11
  actions:
  - ui_accept
- at: 13
  actions:
  - ui_accept
- at: 15
  actions:
  - ui_accept
# A real round first: move into range, strike, end the turn, let the enemy
# phase run. Death must interrupt a loop that is genuinely turning.
- at: 46
  actions:
  - move_up
- at: 61
  actions:
  - move_up
- at: 76
  actions:
  - move_up
- at: 91
  actions:
  - skill_1
- at: 106
  actions:
  - attack_confirm
- at: 121
  actions:
  - end_turn
- at: 600
  actions: []
  assert:
    CombatManager.phase: phase == "PLAYER_TURN"
    Player.health: health > 0
    GameManager.current_state: current_state != "LOST"
- at: 620
  actions:
  - debug_lose_tutorial
# No input from here on. LOST must PERSIST — the four samples below are the
# whole point: a battle that ends and then quietly resumes is the bug.
- at: 700
  actions: []
  assert:
    Player.health: health == 0
    GameManager.current_state: current_state == "LOST"
    GameManager.end_overlay_text: end_overlay_text.contains("战败") == true
    CombatManager.empty_round_stalls: empty_round_stalls == 0
    CombatManager.debug_death_classified_player: debug_death_classified_player == true
    CombatManager.debug_death_target_name: debug_death_target_name == "Player"
- at: 1400
  actions: []
  assert:
    Player.health: health == 0
    GameManager.current_state: current_state == "LOST"
    GameManager.end_overlay_text: end_overlay_text.contains("战败") == true
    CombatManager.empty_round_stalls: empty_round_stalls == 0
    CombatManager.debug_death_classified_player: debug_death_classified_player == true
    CombatManager.debug_death_target_name: debug_death_target_name == "Player"
- at: 2200
  actions: []
  assert:
    Player.health: health == 0
    GameManager.current_state: current_state == "LOST"
    GameManager.end_overlay_text: end_overlay_text.contains("战败") == true
    CombatManager.empty_round_stalls: empty_round_stalls == 0
    CombatManager.debug_death_classified_player: debug_death_classified_player == true
    CombatManager.debug_death_target_name: debug_death_target_name == "Player"
- at: 2999
  actions: []
  assert:
    Player.health: health == 0
    GameManager.current_state: current_state == "LOST"
    GameManager.end_overlay_text: end_overlay_text.contains("战败") == true
    CombatManager.empty_round_stalls: empty_round_stalls == 0
    CombatManager.debug_death_classified_player: debug_death_classified_player == true
    CombatManager.debug_death_target_name: debug_death_target_name == "Player"
