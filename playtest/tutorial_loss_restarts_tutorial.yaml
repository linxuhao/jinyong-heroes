# One play-test scenario. Loaded by playtest/_common.yaml's sibling scan —
# scene / actions / surface live there, this file is only the scenario.
# The basename must equal `name:`.
name: tutorial_loss_restarts_tutorial
description: Losing the tutorial (DEBUG) routes back to a freshly re-instantiated battlefield with the player back at full HP — the teardown path must not crash on freed nodes.
timeline:
- at: 3
  actions:
  - ui_accept
- at: 5
  actions:
  - ui_accept
- at: 7
  actions:
  - ui_accept
- at: 9
  actions:
  - ui_accept
- at: 11
  actions:
  - ui_accept
- at: 13
  actions:
  - ui_accept
- at: 15
  actions:
  - ui_accept
- at: 20
  actions:
  - debug_lose_tutorial
- at: 40
  actions: []
  assert:
    GameManager.current_state: current_state == "LOST"
    GameManager.end_overlay_text: end_overlay_text.contains("战败") and not end_overlay_text.contains("...") and not end_overlay_text.contains("…")
- at: 50
  actions:
  - ui_accept
- at: 80
  actions: []
  assert:
    GameManager.current_state: current_state == "TUTORIAL"
    SceneManager.current_scene: current_scene == "battlefield"
    Player.health: health == 500
