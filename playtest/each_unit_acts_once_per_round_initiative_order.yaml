# One play-test scenario. Loaded by playtest/_common.yaml's sibling scan —
# scene / actions / surface live there, this file is only the scenario.
# The basename must equal `name:`.
name: each_unit_acts_once_per_round_initiative_order
description: Round 1 has Yang Guo (initiative 88) first then the five enemies; East Heretic's 碧海潮生 applies init_minus_20 (-20 initiative, 2 rounds) to Yang Guo, dropping his effective initiative to 68 — below all five — so round 2 begins with East Heretic and Yang Guo acts last.
timeline:
- at: 3
  actions:
  - ui_accept
- at: 5
  actions:
  - ui_accept
- at: 7
  actions:
  - ui_accept
- at: 9
  actions:
  - ui_accept
- at: 11
  actions:
  - ui_accept
- at: 13
  actions:
  - ui_accept
- at: 15
  actions:
  - ui_accept
- at: 20
  actions:
  - end_turn
- at: 30
  actions: []
  assert:
    CombatManager.active_unit_name: active_unit_name != "Yang Guo"
    CombatManager.phase: phase == "ENEMY_TURN"
- at: 1200
  actions: []
  assert:
    CombatManager.current_round: 2
    CombatManager.turn_order: turn_order.size() == 6 and turn_order[0] == "East Heretic" and turn_order[5] == "Yang Guo"
    CombatManager.turn_log: turn_log.size() == 11 and turn_log[0] == "Yang Guo" and turn_log[5] == "West Poison" and turn_log[6] == "East Heretic"
    Player.status_names: status_names.has("init_minus_20") == true
    Player.turns_taken: 1
    East_Heretic.turns_taken: 2
    Central_Divine.turns_taken: 2
    South_Emperor.turns_taken: 2
    North_Beggar.turns_taken: 2
    West_Poison.turns_taken: 2
    CombatManager.last_turn_actor: changed
    CombatManager.empty_round_stalls: empty_round_stalls == 0
# Appended budget proof on the player's round-2 turn (live at f1200): the
# player has never moved, so the probe showed no enemy adjacent at (5,5) —
# first move_down to (5,6) puts South Emperor (5,7) at Chebyshev 1. The first
# attack_confirm must LAND (acted flips, SE 100 -> 61, hint cleared); the
# same-turn second must be REJECTED (本回合已行动, SE still 61); end_turn then
# opens round 3 with Yang Guo first (init_minus_20 expired). Frames probed.
- at: 1210
  actions:
  - move_down
- at: 1240
  actions:
  - attack_confirm
- at: 1280
  actions: []
  assert:
    Player.acted: acted == true
    ActionHintLabel.text: text == ""
    South_Emperor.health: round(100.0 * health / float(max_health)) == 61
- at: 1300
  actions:
  - attack_confirm
- at: 1340
  actions: []
  assert:
    Player.acted: acted == true
    ActionHintLabel.visible: visible == true
    ActionHintLabel.text: text == "本回合已行动"
    South_Emperor.health: round(100.0 * health / float(max_health)) == 61
- at: 1400
  actions:
  - end_turn
- at: 1610
  actions: []
  assert:
    CombatManager.current_round: current_round == 3
    CombatManager.active_unit_name: active_unit_name == "Yang Guo"
    Player.turns_taken: turns_taken == 2
    CombatManager.empty_round_stalls: empty_round_stalls == 0
