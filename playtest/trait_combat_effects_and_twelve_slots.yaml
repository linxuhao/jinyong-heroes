    # stat shift, NOT timing drift (grid_pos + moves_left both stable f875-f895;
    # the 身轻如燕 slide, player.gd:_try_move cost 2, is fully resolved). move_range
    # grew post-C1 (mastery non-zero on real saves) + C5 unlock lever ③
    # (battle_setup.gd:64 move_range += floor(mp/2)). mp = 6 (ext-D + int-D + ext-C
    # + int-C mastered over the 26 debug months; ext-B unmastered by m26, a_dart A
    # granted at f790 AFTER the practice window), agility = 10 -> move_range =
    # 2 + floor(10/20) + floor(6/2) + 0 = 5 (== turn_start_moves_left). Pre-C1
    # mp=0 -> move_range=2 -> the old pin (moves_left==0) was honest then. Stable
    # contract = "the slide costs EXACTLY 2 movement": moves_left == turn-start
    # budget minus 2 (differential, tracks any future move_range re-balance).
    Player.moves_left: moves_left == turn_start_moves_left - 2
