# One play-test scenario. Loaded by playtest/_common.yaml's sibling scan —
# scene / actions / surface live there, this file is only the scenario.
# The basename must equal `name:`.
#
# Defect 6: battle verbs were keyboard-only — end turn was Space, attack
# execution was J (neither written anywhere on screen). Every battle verb now
# has a clickable button:
#   EndTurnButton (结束回合) -> _on_end_turn_pressed -> gate ->
#       CombatManager.end_current_turn()   (the SAME call Space makes)
#   AttackButton  (出招 (J)) -> _on_attack_pressed -> gate ->
#       player._try_keyboard_attack()      (the SAME call J makes)
# Keyboard stays a shortcut; the buttons are additive delegates.
#
# f35 proves the three-part middle chain for both buttons: visible + non-empty
# size + MOUSE_FILTER_STOP + not disabled, the pressed_connected wiring
# snapshot (both true, taken AFTER the connects in _wire_battle_action_buttons),
# and both new geometry observables false (the right-column widgets overlap
# nothing). f40 clicks EndTurnButton with real InputEventMouseButton at the
# button's rect center -> the engine advances to the enemy turn by f120
# (phase == ENEMY_TURN, active unit is no longer Yang Guo) and the per-frame
# disabled refresh (gate: is_player_turn and not paused) disables the button
# during the enemy turn — a click there would emit nothing. Round 2 re-enables
# it (player turn again). Round 2: 3x move_up from the player's round-2
# position (observed (5,5) — round-1 enemy skills knocked the player 2 tiles
# west off the (7,5) start) to (5,2), click AttackButton with NO skill
# selected -> basic attack at the NEAREST adjacent enemy (exactly like J) ->
# Player.acted flips true and East_Heretic (adjacent at (4,2); Central_Divine
# is out of range at (7,4)) takes 39 (30 basic x fa_hui_du 1.3, max_health 95
# -> 56; PROBE-calibrated target and number, recalibrate if a run disagrees).
name: battle_end_turn_attack_buttons
description: >-
  The two new battle action buttons are clickable, wired (pressed_connected
  both true), non-overlapping (hud_button_overlap / hud_desc_overlap false),
  and gate-guarded: clicking EndTurnButton ends the player turn (ENEMY_TURN by
  f120, button disabled while the gate is closed), round 2 re-enables it, and
  clicking AttackButton in round 2 fires the J path — no skill selected so a
  basic attack at the nearest adjacent enemy — flipping Player.acted to true
  and dealing 30 * 1.3 = 39 to East_Heretic (PROBE-calibrated: the player was
  knocked to (5,5) in round 1, moves up to (5,2), and East_Heretic at (4,2) is
  the nearest adjacent target — max_health 95 -> 56 observed).
timeline:
- at: 3
  actions:
  - ui_accept
- at: 5
  actions:
  - ui_accept
- at: 7
  actions:
  - ui_accept
- at: 9
  actions:
  - ui_accept
- at: 11
  actions:
  - ui_accept
- at: 13
  actions:
  - ui_accept
- at: 15
  actions:
  - ui_accept
- at: 20
  actions:
  - tutorial_next
- at: 25
  actions:
  - tutorial_next
- at: 30
  actions:
  - tutorial_next
- at: 35
  actions: []
  assert:
    EndTurnButton.visible: visible == true
    EndTurnButton.size: size.x > 0 and size.y > 0
    EndTurnButton.mouse_filter: mouse_filter == 0
    EndTurnButton.disabled: disabled == false
    AttackButton.visible: visible == true
    AttackButton.size: size.x > 0 and size.y > 0
    AttackButton.mouse_filter: mouse_filter == 0
    AttackButton.disabled: disabled == false
    HUD.pressed_connected: pressed_connected["EndTurnButton"] == true and pressed_connected["AttackButton"] == true
    HUD.hud_button_overlap: hud_button_overlap == false
    HUD.hud_desc_overlap: hud_desc_overlap == false
- at: 40
  actions: []
  clicks:
  - EndTurnButton
- at: 120
  actions: []
  assert:
    CombatManager.phase: phase == "ENEMY_TURN"
    CombatManager.active_unit_name: active_unit_name != "Yang Guo"
    EndTurnButton.disabled: disabled == true
- at: 1500
  actions: []
  assert:
    CombatManager.current_round: changed
    CombatManager.phase: phase == "PLAYER_TURN"
    EndTurnButton.disabled: disabled == false
    HUD.hud_button_overlap: hud_button_overlap == false
- at: 1560
  actions:
  - move_up
- at: 1575
  actions:
  - move_up
- at: 1590
  actions:
  - move_up
- at: 1660
  actions: []
  clicks:
  - AttackButton
- at: 1750
  actions: []
  assert:
    Player.acted: acted == true
    East_Heretic.health: health == max_health - 39
