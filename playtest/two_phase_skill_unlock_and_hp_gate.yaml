# One play-test scenario. Loaded by playtest/_common.yaml's sibling scan —
# scene / actions / surface live there, this file is only the scenario.
# The basename must equal `name:`.
name: two_phase_skill_unlock_and_hp_gate
description: >-
  Rounds 1-3 phase-lock the palm arts (buttons 5-8); round 4 unlocks 5-7, and the HP
  gate on button 8 (usable only below 50% HP) is tracked by the pure hp_gated
  predicate. The below-half precondition is INJECTED at f2600 via
  debug_damage_player (apply_damage down to 40% of max, the normal damage pipeline),
  NOT ground out by the enemies: whether five rounds of enemy attacks happen to take
  Yang Guo past half health is a BALANCE outcome, and tying a gate-logic test to it
  meant every buff reddened this scenario. Every HP assert is written against
  max_health so the contract survives the next rebalance too.
timeline:
- at: 3
  actions:
  - ui_accept
- at: 5
  actions:
  - ui_accept
- at: 7
  actions:
  - ui_accept
- at: 9
  actions:
  - ui_accept
- at: 11
  actions:
  - ui_accept
- at: 13
  actions:
  - ui_accept
- at: 15
  actions:
  - ui_accept
- at: 30
  actions: []
  assert:
    CombatManager.current_round: 1
    Player.health: health == max_health
    SkillButton1.disabled: false
    SkillButton2.disabled: false
    SkillButton3.disabled: false
    SkillButton4.disabled: false
    SkillButton5.disabled: true
    SkillButton6.disabled: true
    SkillButton7.disabled: true
    SkillButton8.disabled: true
    SkillButton8.hp_gated: true
    SkillButton1.hp_gated: false
- at: 40
  actions:
  - end_turn
- at: 500
  actions:
  - end_turn
- at: 1000
  actions:
  - end_turn
- at: 1500
  actions: []
  assert:
    CombatManager.current_round: changed
- at: 1600
  actions:
  - end_turn
- at: 2150
  actions:
  - end_turn
- at: 2600
  actions:
  - debug_damage_player
- at: 2700
  actions: []
  assert:
    CombatManager.current_round: current_round >= 4
    Player.health: health < max_health * 0.5
    SkillButton1.hp_gated: false
    SkillButton5.disabled: false
    SkillButton6.disabled: false
    SkillButton7.disabled: false
    SkillButton8.disabled: false
    SkillButton8.hp_gated: false
