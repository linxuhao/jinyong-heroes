# One play-test scenario. Loaded by playtest/_common.yaml's sibling scan —
# scene / actions / surface live there, this file is only the scenario.
# The basename must equal `name:`.
#
# CARD 0 (L1) — ENEMY-TURN WALL-CLOCK NAIL.
# The owner's 2026-09-02 red: on the PUBLISHED web build every enemy turn in
# the tutorial battle took 20-40 s wall-clock (two rounds ≈ 6 min; a playtester
# abandoned the tutorial after 23 min). This pin bounds a full enemy round at
# <= 10 s and a single enemy turn at <= 2 s using the three additive CombatManager
# observables (debug_enemy_turn_msec / debug_enemy_round_msec /
# debug_enemy_turn_index) without touching any AI decision or gameplay number.
#
# The local headless harness is deterministic and fast (the 0.25 s tween watchdog
# already bounds a round to ~240 frames ≈ 4 s at 60 fps), so this pin is GREEN BY
# CONSTRUCTION locally — the 2026-09-02 web report is the red evidence, and the
# web measurement path (see design/30_presentation.md) is the meaningful
# verification. The scenario still proves the game advances (index differential +
# >= 5, round_msec > 0) so the observables are never vacuously satisfied by a
# round that never ran.
name: enemy_turn_wall_clock
description: >-
  Boot to the tutorial battle, hand the turn over with end_turn (the player acts
  first, initiative 88), let the five-enemy round run, and on the frame the
  battle returns to the player assert the enemy-run wall-clock pin: a full enemy
  round <= 10 s, a single enemy turn <= 2 s, and that all five enemies acted
  (debug_enemy_turn_index >= 5, plus a `changed` differential on an earlier
  frame). debug_enemy_round_msec > 0 proves the observable actually measured a
  completed enemy round (so the <= 10 s bound is never met vacuously by a 0 that
  never triggered). The `changed` differential and the `>= 5` bound live on
  DIFFERENT frames because a YAML mapping cannot carry the same key twice; the
  round_msec floor (> 0) and ceiling (<= 10000) are merged into ONE mapping
  entry (`> 0 and <= 10000`) for the same reason.
  CARD 0b (R5) additions, kept ADDITIVE over the card-0 asserts above: an f2
  pre-battle frame asserting the acting-unit marker is hidden (visible false,
  unit_name ''); a marker-visible mid-round f200 differential (unit_name
  `changed` across the player->enemy handover, visible true); the split-observable
  sanity (each segment >= 0 and move+attack+other <= debug_enemy_turn_msec once
  the index has advanced past 0); and UiOcclusionWatch violations == 0 /
  scan_ok == true on a marker-visible frame. The pre-existing round/turn/index
  asserts are byte-identical to card 0; the pacing fix only makes the earlier
  frames arrive sooner, so no existing frame index had to move. The local harness
  split here is a sanity check only — the AUTHORITATIVE per-enemy split is the web
  console 'enemy_turn_split' line (see delivery notes; recorded BLOCKED without a
  browser run).
timeline:
# CARD 0b: pre-battle frame — the ring must be absent (mirrors untouched defaults).
- at: 2
  actions: []
  assert:
    CombatManager.acting_marker_visible: acting_marker_visible == false
    CombatManager.acting_marker_unit_name: acting_marker_unit_name == ""
# Boot to battle exactly as each_unit_acts_once_per_round_initiative_order does
# (7x ui_accept through the menu/creation flow), player round-1 turn live at f20.
- {at: 3, actions: [ui_accept]}
- {at: 5, actions: [ui_accept]}
- {at: 7, actions: [ui_accept]}
- {at: 9, actions: [ui_accept]}
- {at: 11, actions: [ui_accept]}
- {at: 13, actions: [ui_accept]}
- {at: 15, actions: [ui_accept]}
# Hand the player's round-1 turn over to the five-enemy round.
- {at: 20, actions: [end_turn]}
# After one enemy has completed its turn the count differential is live. Probed:
# the first enemy turn completes well before f200.
- at: 200
  actions: []
  assert:
    CombatManager.debug_enemy_turn_index: changed
    CombatManager.acting_marker_visible: acting_marker_visible == true
    CombatManager.acting_marker_unit_name: changed
    CombatManager.debug_enemy_move_msec: debug_enemy_move_msec >= 0
    UiOcclusionWatch.violations: violations == 0
    UiOcclusionWatch.scan_ok: scan_ok == true
# Round-2 player turn (Yang Guo acts last under East Heretic's init_minus_20):
# both enemies rounds have run, so the index is >= 5 and phase is PLAYER_TURN.
- at: 1100
  actions: []
  assert:
    CombatManager.phase: phase == "PLAYER_TURN"
    CombatManager.debug_enemy_turn_index: debug_enemy_turn_index >= 5
    CombatManager.debug_enemy_round_msec: debug_enemy_round_msec > 0 and debug_enemy_round_msec <= 10000
    CombatManager.debug_enemy_turn_msec: debug_enemy_turn_msec <= 2000
    CombatManager.acting_marker_unit_name: acting_marker_unit_name != ""
    CombatManager.debug_enemy_move_msec: debug_enemy_move_msec >= 0 and debug_enemy_attack_msec >= 0 and debug_enemy_other_msec >= 0 and debug_enemy_move_msec + debug_enemy_attack_msec + debug_enemy_other_msec <= debug_enemy_turn_msec
