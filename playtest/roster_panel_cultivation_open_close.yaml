# One play-test scenario. Loaded by playtest/_common.yaml's sibling scan —
# scene / actions / surface live there, this file is only the scenario.
# The basename must equal `name:`.
#
# CULTIVATION entry reachability for the roster panel. Direct-boots
# cultivation.tscn (a STABLE_STATES segment — design/40_progression §8).
# Fresh boot sits at month 1 / CARD_PICK. Click opens the panel, the three
# sections render, open/close consume no month or action (phase stays
# CARD_PICK, month stays 1), one real month advance makes month: changed,
# reopen then close proves the panel re-syncs with the changed state
# underneath. All open/close interaction is clicks only — no keyboard
# required (mobile-first surface).
#
# gongfa_count is a relational non-negative bound: a FRESH direct boot grants
# no sect arts (sect_id is unset, so _grant_year_arts early-outs), so
# gongfa_count starts at 0. Content presence is carried by the section-header
# assertion (人物/功法/物品). If the measurement task observes a start grant
# on the real build it should tighten this to > 0.
#
# MONTH ADVANCE (2026-08-31): the month advance is driven by CLICKS, NOT
# debug_step_month. That token is registered in _common.yaml actions and
# consumed by cultivation.gd::_process but gated on
# GameManager.current_state == "CULTIVATION"; a direct scene boot does not run
# the normal state transition, so debug_step_month never advances a month under
# this scenario's boot (measured: month stayed 1, `month: changed` red). The
# confirmed fallback implemented here is one real month played by clicks: a
# CultOptionButton0 card pick (CARD_PICK -> ACTION_PICK) then a CultOptionButton2
# 做工/work action (ACTION_PICK option index 2 -> _after_action advances the
# calendar back to CARD_PICK). Those buttons are NOT state-gated, only
# phase-gated, so they advance a month under a direct scene boot.
#
# RED-FIRST EVIDENCE — TEMPORARY PLACEHOLDER (do not treat as measured).
# The follow-up measurement task fills real measured values here via the
# TEMPORARY RED-FIRST REVERT method and OVERWRITES this block.
#   fail frame:       <filled by measurement>
#   first assertion:  <filled by measurement>
#   exact error:      <filled by measurement>
#   red-before-green: <filled by measurement>
name: roster_panel_cultivation_open_close
description: >-
  Entry reachability + content presence + no-consumption + re-sync in
  CULTIVATION. Direct-boot cultivation.tscn at CARD_PICK month 1; click opens
  the roster panel (three sections render, cursor_markers_visible false on
  panel and segment), click closes (phase still CARD_PICK, month still 1 — no
  month/action consumed); one real month advance makes month: changed; reopen
  then close proves the panel re-syncs with the changed state underneath.
scene: res://scenes/segments/cultivation.tscn
timeline:
- at: 30
  actions: []
  assert:
    CultivationScreen.visible: visible == true
    CultivationScreen.phase: phase == "CARD_PICK"
    CultivationScreen.month: month == 1
    RosterOpenButton.visible: visible == true
- at: 40
  actions: []
  clicks:
  - RosterOpenButton
- at: 50
  actions: []
  assert:
    RosterPanel.is_open: is_open == true
    RosterBodyLabel.text: 'text.contains("人物") and text.contains("功法") and text.contains("物品")'
    RosterPanel.gongfa_count: gongfa_count >= 0
    RosterPanel.cursor_markers_visible: cursor_markers_visible == false
    CultivationScreen.cursor_markers_visible: cursor_markers_visible == false
- at: 60
  actions: []
  clicks:
  - RosterCloseButton
- at: 70
  actions: []
  assert:
    RosterPanel.is_open: is_open == false
    CultivationScreen.phase: phase == "CARD_PICK"
    CultivationScreen.month: month == 1
# One real month advance via clicks (no state-machine dependency): a CARD_PICK
# option click picks the card (CultOptionButton0) -> ACTION_PICK, then an
# ACTION_PICK option click does 做工/work (CultOptionButton2, index 2 of
# [练功,修习,做工,游历,存盘,读档,删档]) -> _after_action() advances the
# calendar. Structural differential — no absolute month literal.
- at: 80
  actions: []
  clicks:
  - CultOptionButton0
- at: 90
  actions: []
  clicks:
  - CultOptionButton2
- at: 100
  actions: []
  assert:
    CultivationScreen.phase: phase == "CARD_PICK"
    CultivationScreen.month: changed
# Re-sync: reopen after the state changed underneath.
- at: 110
  actions: []
  clicks:
  - RosterOpenButton
- at: 120
  actions: []
  assert:
    RosterPanel.is_open: is_open == true
- at: 130
  actions: []
  clicks:
  - RosterCloseButton
- at: 140
  actions: []
  assert:
    RosterPanel.is_open: is_open == false