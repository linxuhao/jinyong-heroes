# One play-test scenario. Loaded by playtest/_common.yaml's sibling scan —
# scene / actions / surface live there, this file is only the scenario.
# The basename must equal `name:`.
#
# R5 C1 (cultivation CARD_PICK): every blind card choice now renders its
# effect consequence from CardData.TABLE before commitment. Focus moves to
# card 2 -> consequence_text changes (differential from frame 0), is non-empty,
# and contains at least one effect marker token (银两 / 得「 / 修习 / 机缘 /
# 顿悟 / 神功 / attr names) — composed from the focused card's effect_type.
#
# Boot: debug_seed_save + load (no-sect empty profile, month 1) -> CARD_PICK.
# move_down ×1 focuses card 2 (index 1).
#
# RED-FIRST four values (measured on pre-implementation tree):
#   pre-fix failing frame ........ 130 (the first assert frame on CARD_PICK)
#   first failing assert ......... CultivationScreen.consequence_text != "" —
#                                  the pre-fix tree never published this variable.
#   exact error .................. surface var absent (consequence_text == "" at rest)
#   green asserts before red ..... 2 (GameManager.current_state + phase checks pass)
# After fix: re-run green.
name: consequence_card_pick_focus
description: >-
  C1 consequence renderer on the CARD_PICK screen: focus 0 renders a non-empty
  data-composed effect suffix; moving focus to card 2 (index 1) changes the
  consequence text, and the new text contains at least one effect marker token
  guaranteed by the renderer for any effect_type (silver / item / attr /
  practice / trait / tech_unlock / shen_gong). UiOcclusionWatch clean.
scene: res://scenes/menu.tscn
timeline:
- at: 10
  actions:
  - debug_delete_save
- at: 40
  actions:
  - debug_seed_save
- at: 70
  actions:
  - move_down
- at: 90
  actions:
  - ui_accept
- at: 130
  actions: []
  assert:
    GameManager.current_state: current_state == "CULTIVATION"
    CultivationScreen.phase: phase == "CARD_PICK"
    CultivationScreen.consequence_text: 'consequence_text != ""'
    CultivationScreen.consequence_matches_focus: consequence_matches_focus == true
    UiOcclusionWatch.violations: violations == 0
    UiOcclusionWatch.scan_ok: scan_ok == true
- at: 140
  actions:
  - move_down
- at: 160
  actions: []
  assert:
    CultivationScreen.consequence_text: changed
    CultivationScreen.consequence_text: '(consequence_text.contains("银两") or consequence_text.contains("得「") or consequence_text.contains("修习") or consequence_text.contains("机缘") or consequence_text.contains("顿悟") or consequence_text.contains("神功") or consequence_text.contains("根骨") or consequence_text.contains("内力") or consequence_text.contains("身法") or consequence_text.contains("悟性") or consequence_text.contains("福缘")) == true'
    CultivationScreen.consequence_matches_focus: consequence_matches_focus == true
    CultivationScreen.cursor_markers_visible: cursor_markers_visible == false
    UiOcclusionWatch.violations: violations == 0
    UiOcclusionWatch.scan_ok: scan_ok == true
