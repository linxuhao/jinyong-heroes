# One play-test scenario. Loaded by playtest/_common.yaml's sibling scan —
# scene / actions / surface live there, this file is only the scenario.
# The basename must equal `name:`.
#
# CLICKS-ONLY SPINE — the RED-FIRST NAIL (2026-08-29).
#
# This scenario walks the full six-segment main storyline using ONLY clicks:
# (real GUI hit-tests via Input.parse_input_event → Control.get_global_rect()
# center). ZERO keyboard actions (no ui_accept, no move_*, no tutorial_next,
# no end_turn, no skill_*, no use_facility). The single allowed non-click
# timeline action is `debug_win_tutorial` — an unbound DEBUG action consumed in
# _process (not a keyboard input). It is the same instrument spine_to_ending
# uses at f20 to seed the battle outcome. The battle screen's clickability is
# separately proven by four existing click scenarios (battle_end_turn_attack_
# buttons, click_targeting_fixed, undo_button_retreat, click_portrait_body_
# targets_enemy) plus one in-scenario real AttackButton click below.
#
# ADJUDICATION (design/90_decisions.md, 2026-08-29):
# (a) debug_win_tutorial is the ONE sanctioned non-click action. A full
#     click-fought battle cannot fit the frame cap, and splitting the spine
#     would leave "overlay → … → ending reachable by taps" unproven in one
#     run. The seed is documented here and in the report.
# (b) The LOST/RetryButton click path is covered at unit level
#     (tests/test_game_manager_fsm.gd asserts both buttons exist, are visible
#     and wired in headless mode) plus the untouched keyboard scenario
#     tutorial_loss_restarts_tutorial keeps LOST routing green. Not a second
#     clicks-only scenario (marginal gate value, same code shape).
# (c) The storyline does NOT detour into the facility (off the six-segment
#     mainline; the facility buttons' click-reachability is proven by the
#     companion scenario map_facility_buttons_click.yaml).
#
# RED-FIRST EVIDENCE — MEASURED (2026-08-29).
#   The four values below were MEASURED from a real run of
#   godot_playtest_scenario(scenario="clicks_only_storyline") with the
#   TEMPORARY RED-FIRST REVERT applied to scripts/autoload/game_manager.gd
#   (overlay buttons commented out; see revert recipe below). The file was
#   then restored byte-identically and the scenario re-confirmed GREEN (47/47).
#
#   Measured values (from the red run, 8/47):
#     failing_frame: 265
#     first_failing_assert: ContinueButton.visible (f265, expr "visible == true")
#     exact_error: "aim: node not found: ContinueButton (spec: ContinueButton)"
#     green_asserts_before_red: 8
#                           (f60: 2 asserts pass; f90: 1; f120: 1; f150: 1;
#                           f230: 1; f265 first-two: 2 = 2+1+1+1+1+2 = 8)
#
#   DO NOT COMMIT: reproduction needs the TEMPORARY RED-FIRST REVERT below
#   applied to scripts/autoload/game_manager.gd (this file's timeline is the
#   unfixed-tree expectation). The revert is DOCUMENTED ONLY — it is never
#   committed (see final/delivery_notes_touch_reach_red_first.md).
#   RED repro command (verbatim — the exact one this step ran):
#     apply the temporary revert below to scripts/autoload/game_manager.gd,
#     then run godot_playtest_scenario(scenario="clicks_only_storyline")
#     (the external sidecar aitelier/tools/godot_playtest/impl.py, invoked
#     per-scenario from this implementing step; the pipeline 5_compile gate
#     writes the same into playtest_summary.md / playtest_report.json).
#   Measured runs (this step, real harness output):
#     RED   -> 8/47, hard gate False. First runtime error:
#              "aim: node not found: ContinueButton (spec: ContinueButton)".
#              First failing assert: f265 ContinueButton.visible.
#     GREEN -> after byte-identical restore of game_manager.gd, 47/47,
#              hard gate True (staged file = repo baseline, no diff).
#   RED revert recipe (verbatim, mark # TEMPORARY RED-FIRST REVERT — DO NOT
#   COMMIT). In _show_end_game_overlay (scripts/autoload/game_manager.gd)
#   comment out:
#     - the 'var continue_btn: Button = Button.new()' .. 'panel.add_child(continue_btn)' block;
#     - the 'var retry_btn: Button = Button.new()' .. 'panel.add_child(retry_btn)' block;
#     - in the re-show branch: the existing_continue and existing_retry
#       re-sync blocks;
#     - both _refresh_end_overlay_pressed_connected() call sites (re-show
#       branch + construction tail).
#   Keep the _refresh_end_overlay_pressed_connected() function definition
#   itself, and leave _unhandled_input (keyboard branch) and all other screens'
#   buttons intact.
name: clicks_only_storyline
description: >-
  The full six-segment main storyline driven by clicks only (zero keyboard
  actions, one documented debug_win_tutorial seed). Menu → creation → tutorial
  battle → tutorial end overlay → transition → sect select → cultivation (36
  months, 做工/month) → map (4 travel legs, 3 events resolved) → ending →
  restart. Anchors node NAMES only (never option texts); anchors the control
  body itself (never *_ClickTarget). The single non-click action is
  debug_win_tutorial (battle-outcome seed, adjudicated). First-red at the
  tutorial-end overlay (ContinueButton does not exist pre-fix).
#
# FRAME-TIMING FIX (2026-08-29, task fix_clicks_only_storyline_frame_timing).
#   ROOT CAUSE (measured, not predicted): the gate reds on this scenario with
#   88 `aim: node not found` runtime errors — the FIRST is MenuEntry0 at frame
#   10. The default boot scene is res://scenes/main.tscn, a BARE shell (Main /
#   Camera / SceneHost / SegmentLayer / SegmentHost / HUD / TutorialOverlay —
#   NO MenuPanel, NO MenuEntry0). The harness _resolve() ends with a recursive
#   whole-tree name search, so `node not found` means ONLY "that node is not in
#   the tree at that frame". MenuEntry0 never exists under a main.tscn boot =>
#   the game never leaves the main menu => every later click aims at a screen
#   never reached (measured first failing assert at f30: current_state observed
#   "TUTORIAL" where "CHARACTER_CREATION" was expected).
#   FIX: `scene: res://scenes/menu.tscn` below (the documented per-scenario
#   override — boots this scenario straight into the real main menu, proven by
#   main_menu_entries / menu_to_creation_to_tutorial_order), and every `at:`
#   re-aligned so each click lands strictly AFTER its target node is in the
#   tree. The tutorial intro leg now uses all SEVEN Next clicks (STEP_COUNT
#   == 7), and the BATTLE assert sits strictly after the 7th. The proof is
#   preserved: menu -> creation -> tutorial battle -> overlay -> transition ->
#   sect -> 36-month cultivation -> map -> events -> ending -> restart, all
#   driven by clicks, zero keyboard actions, single debug_win_tutorial seed.
scene: res://scenes/menu.tscn
