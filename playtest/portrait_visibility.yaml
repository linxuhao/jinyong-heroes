# One play-test scenario. Loaded by playtest/_common.yaml's sibling scan —
# scene / actions / surface live there, this file is only the scenario.
# The basename must equal `name:`.
#
# Camera-level visibility gate (2026-08-28 rewrite). Full-portrait visibility is
# the camera/layout's property, NOT a sprite's: the follow Camera2D frames the
# ACTIVE unit into the unobstructed band between the HUD top bar and the action
# bar, and an INACTIVE portrait sitting partly off-viewport or behind the HUD is
# normal framing, not a defect. The sprite-level VisibilityProbe layers
# (portrait_visible / portrait_fail_layer / portrait_covered_frac) no longer
# adjudicate portrait placement — this scenario asserts game-level observables
# the CameraFollower publishes instead: the camera stays within its
# constant-derived no-blank range (camera_y in [camera_y_lo, camera_y_hi]), the
# active unit's screen y sits inside the unobstructed [hud_band_top,
# hud_band_bottom], and the follow target IS the active actor
# (follow_target_is_active). A portrait_tex_size > 0 sanity is kept so an empty
# texture still reddens the gate.
name: portrait_visibility
timeline:
# One entry per frame: `at` is a single integer. The shorthand from the probe
# notes table (3..15 / 20/25/30) is NOT valid spec syntax — it reached int()
# inside the harness and came back as a bare HTTP 500, which read as a
# builder outage and cost this round its measurement. The harness now
# rejects it by name instead (godot_harness.py, 2026-08-25).
- {at: 3, actions: [ui_accept]}
- {at: 5, actions: [ui_accept]}
- {at: 7, actions: [ui_accept]}
- {at: 9, actions: [ui_accept]}
- {at: 11, actions: [ui_accept]}
- {at: 13, actions: [ui_accept]}
- {at: 15, actions: [ui_accept]}
- {at: 20, actions: [tutorial_next]}
- {at: 25, actions: [tutorial_next]}
- {at: 30, actions: [tutorial_next]}
- at: 40
  assert:
    Camera.follow_target_is_active: follow_target_is_active == true
    Camera.active_unit_screen_y: active_unit_screen_y >= hud_band_top and active_unit_screen_y <= hud_band_bottom
    Camera.camera_position: camera_position.y >= camera_y_lo and camera_position.y <= camera_y_hi
    Player.portrait_tex_size: portrait_tex_size.x > 0.0 and portrait_tex_size.y > 0.0
    Central_Divine.portrait_tex_size: portrait_tex_size.x > 0.0 and portrait_tex_size.y > 0.0
    East_Heretic.portrait_tex_size: portrait_tex_size.x > 0.0 and portrait_tex_size.y > 0.0
    West_Poison.portrait_tex_size: portrait_tex_size.x > 0.0 and portrait_tex_size.y > 0.0
    South_Emperor.portrait_tex_size: portrait_tex_size.x > 0.0 and portrait_tex_size.y > 0.0
    North_Beggar.portrait_tex_size: portrait_tex_size.x > 0.0 and portrait_tex_size.y > 0.0
