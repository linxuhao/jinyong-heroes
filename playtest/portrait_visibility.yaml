# One play-test scenario. Loaded by playtest/_common.yaml's sibling scan —
# scene / actions / surface live there, this file is only the scenario.
# The basename must equal `name:`.
#
# UX-01 regression gate: every battle unit's portrait must put ink on the
# rendered frame at f40 (battle turn 1, all six units present). Each unit's
# `portrait_visible` is the six-layer VisibilityProbe predicate (hidden_in_tree
# / null_texture / zero_rect / off_viewport / clipped / occluded); the fail
# layer id says WHY when one is red. This scenario is the re-measurement
# instrument for the A2 fix set, which was EMPTY at wiring time (probe PENDING,
# builder outage) — its first green run is the measured confirmation of
# all-six-visible, its first red run prints the real observed fail_layer.
name: portrait_visibility
timeline:
# One entry per frame: `at` is a single integer. The shorthand from the probe
# notes table (3..15 / 20/25/30) is NOT valid spec syntax — it reached int()
# inside the harness and came back as a bare HTTP 500, which read as a
# builder outage and cost this round its measurement. The harness now
# rejects it by name instead (godot_harness.py, 2026-08-25).
- {at: 3, actions: [ui_accept]}
- {at: 5, actions: [ui_accept]}
- {at: 7, actions: [ui_accept]}
- {at: 9, actions: [ui_accept]}
- {at: 11, actions: [ui_accept]}
- {at: 13, actions: [ui_accept]}
- {at: 15, actions: [ui_accept]}
- {at: 20, actions: [tutorial_next]}
- {at: 25, actions: [tutorial_next]}
- {at: 30, actions: [tutorial_next]}
- at: 40
  assert:
    Player.portrait_visible: portrait_visible == true
    Player.portrait_fail_layer: portrait_fail_layer == ""
    Central_Divine.portrait_visible: portrait_visible == true
    Central_Divine.portrait_fail_layer: portrait_fail_layer == ""
    East_Heretic.portrait_visible: portrait_visible == true
    West_Poison.portrait_visible: portrait_visible == true
    South_Emperor.portrait_visible: portrait_visible == true
    North_Beggar.portrait_visible: portrait_visible == true
    Player.sprite_top: sprite_top >= 0.0
    Central_Divine.sprite_top: sprite_top >= 0.0
    East_Heretic.portrait_fail_layer: portrait_fail_layer == ""
    West_Poison.portrait_fail_layer: portrait_fail_layer == ""
    South_Emperor.portrait_fail_layer: portrait_fail_layer == ""
    North_Beggar.portrait_fail_layer: portrait_fail_layer == ""
    Player.portrait_covered_frac: portrait_covered_frac < 0.25
    Central_Divine.portrait_covered_frac: portrait_covered_frac < 0.25
    East_Heretic.portrait_covered_frac: portrait_covered_frac < 0.25
    West_Poison.portrait_covered_frac: portrait_covered_frac < 0.25
    South_Emperor.portrait_covered_frac: portrait_covered_frac < 0.25
    North_Beggar.portrait_covered_frac: portrait_covered_frac < 0.25
    Player.portrait_tex_size: portrait_tex_size.x > 0.0 and portrait_tex_size.y > 0.0
    Central_Divine.portrait_tex_size: portrait_tex_size.x > 0.0 and portrait_tex_size.y > 0.0
