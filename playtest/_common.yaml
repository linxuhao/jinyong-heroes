# playtest/_common.yaml — the SHARED half of the play-test contract.
#
# The contract used to be one 1478-line `playtest_spec.yaml` holding all 26
# scenarios. That shape made every single-scenario edit a whole-file rewrite,
# and a whole-file rewrite is how assertions get dropped: the 2026-08-24 audit
# of the previous round found scenarios that came back from a "fix" with fewer
# asserts than they went in with, and nobody noticed because the diff was 1478
# lines wide. One file per scenario makes the blast radius one scenario.
#
# LAYOUT
#   playtest/_common.yaml      <- this file: scene / actions / surface + order
#   playtest/<scenario>.yaml   <- ONE scenario each: {name, description, timeline}
#                                 the file IS the scenario mapping; the file's
#                                 basename must equal its `name:`.
#
# `scenario_order` fixes the run order (it is the order the monolith had). A
# scenario file that is not listed still runs — it is appended after the listed
# ones — so adding a scenario is "drop in a file", and listing it is only about
# where it lands in the report.
#
# PER-SCENARIO `scene:` (2026-08-24). The `scene:` below is the DEFAULT. Any
# scenario file may override it with its own `scene:` line and boot straight
# into that scene instead of main.tscn. Every scenario already runs in its own
# fresh Godot process, so this costs nothing and buys two things:
#
#   * UNIT-LEVEL TESTS. A scenario about the creation screen can boot
#     `res://scenes/segments/creation.tscn` and assert at frame 30, instead of
#     replaying the whole boot (7x ui_accept, then ~110 frames) to get there.
#     Measured: CreationScreen.visible holds at f30 on a direct boot.
#   * INDEPENDENCE FROM THE BOOT FLOW. A scenario that boots its own scene does
#     not shift when something is inserted ahead of the tutorial. Scenarios that
#     boot main.tscn all carry ABSOLUTE frame numbers, so changing the boot flow
#     moves every one of them — that is a 27-file rewrite, and a 27-file rewrite
#     is how this contract lost assertions before (see the note above).
#
# Autoloads DO load in scene-path mode — verified, not assumed (GameManager and
# SceneManager both read fine from a direct creation.tscn boot). The `-s` caveat
# recorded in design/90_decisions.md is about SceneTree SCRIPT mode, which is a
# different thing. What a direct boot does NOT give you is any state an earlier
# segment would have set up: use the DEBUG injection actions for that.
#
# Prefer a direct scene boot for anything that is really about ONE screen.
# Keep main.tscn for scenarios that are about the game hanging together
# (spine_to_ending is the whole point of that shape).
#
# The loader (aitelier/tools/godot_playtest/impl.py:_read_spec) prefers this
# directory when it exists and falls back to a root `playtest_spec.yaml` for
# projects that still carry the monolith. Do not keep both: if a
# `playtest_spec.yaml` reappears next to this directory it is IGNORED, and the
# play-test summary says so in its `summary` line.
#
# `clicks:` — REAL MOUSE EVENTS, and how to aim them (2026-08-25).
# A `clicks:` entry is a spec string:  "<Node>[ +dx,dy][ left|right|middle]"
#
#   - Central_Divine +0,0             左键点这个节点的屏幕中心
#     (2026-08-29 90_decisions.md 裁定:点击锚一律锚在控件/单位本体上,
#      不许挂 *_ClickTarget — 一个节点不能既是可命中的具名锚点、
#      又是不许收到点击的控件)
#   - Player +0,-64                   左键点玩家上方一格(TILE_SIZE = 64)
#   - Player +64,0 right              右键点玩家右边一格
#
# **两种锚点都支持,别推断成「只支持 Control」**:Control 取 `get_global_rect()`
# 的中心,Node2D(棋盘上的单位)取 `get_global_transform_with_canvas().origin`。
# 2026-08-25 有人据「harness 只认 Control」诊断过一次点击移动失灵,那是错的 ——
# 实测 `Player +64,0` 精确落在 [544, 352](格子 (8,5) 中心)。点击到不了处理函数时,
# 先分清是「没发出」还是「发出了被吞掉」:`Player.debug_input_events` 数的是到达
# `_input` 的原始事件,`debug_click_events` 数的是进了 `handle_world_click` 的。
# 前者有、后者没有 = 有个 Control 在 GUI 阶段吃掉了它(那次就是 main.tscn 的
# `SegmentHost` 漏写 `mouse_filter`)。
#
# 这是 HIT TEST,不是调用处理函数:被别的控件盖住、mouse_filter=IGNORE、
# 尺寸为 0、飘出视口的目标,事件就是收不到——而 `debug_click_*` 那种直接
# 调处理函数的动作永远看不见这类失败。
#
# 为什么需要 OFFSET:战场格子是 `_draw()` 画出来的,空格子没有节点名可寻址,
# 所以点击移动的目的地没法按名字写。写死屏幕像素能跑,但相机或格子尺寸一变
# 就烂。锚在活节点上,场景就用设计本身的说法表达(「玩家右边那一格」)。
#
# 每一种失败都是 push_error → 硬闸门红,绝不静默跳过:
#   `Player +64`(缺一维)、`Player sideways`(未知 token)、
#   `Player +99999,0`(点在视口外)—— 三条都实测过。
#
# 已实测的边界(2026-08-24):`clicks:` 驱动不了「回头去问
# get_global_mouse_position() 的处理函数」。处理函数必须用事件自己带的坐标
# (`get_canvas_transform().affine_inverse() * event.position`)。player.gd 与
# enemy.gd 现在都是这个形状。另外 Godot 的 GUI 拾取器不会把事件路由到
# 「祖先是 Node2D 的 Control」——世界坐标的命中要走 `_input` 中继。
#
# `hovers:` — MOTION-ONLY mouse events (2026-08-28, Defect C).
# A `hovers:` entry uses the SAME "<Node>[ +dx,dy]" anchor grammar as `clicks:`
# (Control 取 get_global_rect() 的中心) but takes NO button token:
# `TraitToggle5` moves the pointer there without pressing, so Button
# mouse_entered / mouse_exited fire with no press. A `left`/`right`/`middle`
# token after a hover entry is a push_error HARD failure, never a silent
# ignore. Why motion-only matters: a `clicks:` entry also fires mouse_entered
# (pointer moves before the press), so hover-WITHOUT-toggle can only be pinned
# by a motion-only entry. A same-frame `hovers:` entry is pushed before any
# `clicks:` entry (pointer-then-press, matching a real mouse).
# Caveat: `hovers:` exists only in the REBUILT sidecar image — a scenario failing
# with "unknown key" means a stale image, not a bad scenario.
#
# ── AUTHORED HEADER, carried verbatim from the monolithic
#    playtest_spec.yaml this directory replaced ──
# Playtest contract — audited (step playtest_contract, A1-A19) against the
# implemented code: every surface var, state string, trait index, deck count,
# sect order, menu cell index, debug action and frame number verified matching
# (scripts/autoload/*, scripts/segments/*, scripts/data/*, scripts/ui/*,
# project.godot [input]). Zero drift found — the 12 protected battle scenarios
# are byte-unchanged except the four Chinese display-text sites and the one
# CJK-presence assertion; the 8 segment/spine scenarios are consistent with the
# runtime. Harness contract (from repo usage): scene boots main.tscn; actions
# are Input.action_press names present in project.godot [input]; assert values
# are "changed" | YAML literal | single-quoted GDScript boolean expression;
# frame cap 3000 (last assert <= 2999; spine <= 2900).

# THE BOOT SCENE IS NOT THE GAME'S BOOT SCENE (2026-08-27). Read this before
# trusting a green suite.
#
# The contract boots `res://scenes/main.tscn`. The GAME boots
# `run/main_scene` = `res://scenes/menu.tscn`. They are structurally identical
# twins — same Main / Camera / SceneHost / SegmentLayer / SegmentHost /
# HUDLayer / TutorialLayer — and menu.tscn stays in the tree for the whole
# session, because SceneManager swaps SEGMENTS inside it rather than changing
# scenes. So every property of menu.tscn's own nodes is UNTESTED by all 57
# scenarios, and a defect that lives in one of them is invisible here.
#
# That is not hypothetical. menu.tscn's `SegmentHost` was missing
# `mouse_filter = 2` — a full-rect Control, default STOP, parked over the board
# for the entire game, swallowing every mouse click that did not land on a
# Button. Left-click movement did not work for any player, on web or desktop,
# while this suite reported 57/57. main.tscn HAS the line (it is the fix from
# the first time this happened, recorded in the `clicks:` note below); the
# sibling never got it.
#
# It took a real X11 window driven by xdotool to see it, because `clicks:`
# injects with Input.parse_input_event and never reaches the GUI phase where a
# STOP Control decides the outcome. `tests/test_playtest_contract_smoke.py`
# now pins both halves: every full-rect host must be click-through, and this
# divergence must stay written down.
#
