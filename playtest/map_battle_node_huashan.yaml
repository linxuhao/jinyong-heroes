# 华山: arriving at a battle node actually starts the battle.
#
# The tactical battle is this game's core system and it could be entered EXACTLY
# ONCE, from the tutorial. Afterwards the map produced text events and nothing
# else. 华山 is the first node whose battle slot is `active`, so this scenario
# pins the thing that was missing: travel onto it and a battle begins.
#
# The route reuses map_node_event_shaolin's path as far as 少林 (full boot,
# tutorial, creation, cultivation, map) because start_map_battle() is hard-gated
# to current_state == MAP — a direct map.tscn boot leaves GameManager in TUTORIAL
# and the battle would silently not start, which is exactly the failure this
# scenario must be able to see.
#
# Two move_right steps, not one: 少林's neighbours are [洛阳, 华山] and the focus
# starts on 洛阳, so a single step travels back the way you came. Measured, not
# guessed — the first run of this scenario ended at 洛阳 with events_resolved_count
# 2 and entry_battle_id "", which is exactly what one step produces.
#
# focus_id is asserted BEFORE the travel accept on purpose. 少林's neighbours are
# [洛阳, 华山]; if the focus step ever lands somewhere else, this goes red naming
# the node it actually focused instead of failing later with an unexplained
# state, which is the difference between a diagnosis and a mystery.
#
# THIS FILE WAS REWRITTEN 2026-09-01 (jinyong-huashan round) as a documentation
# EXTENSION of the same scenario — same name:, same scenario_order slot, the
# 78-scenario registry count unchanged. It gates "can fight", not "loaded".
#
# The OLD gate proved only that a battle SCENE loads: travel onto 华山 ->
# current_state == "BATTLE" on the battlefield scene with no swap pending.
# That is exactly the class of green-on-absence the project keeps tripping on —
# the observed defect (2026-08-31, frame-by-frame) was a battle that LOADED but
# never BEGAN: CombatManager.phase == "IDLE", current_round == 0,
# turn_order == [], EndTurnButton disabled forever, tutorial_battle == true,
# and the hard-coded tutorial Yang Guo (HP 1000) standing in for the player's
# profile-built hero, with the tutorial intro overlay replayed. "A battle
# begins" was never asserted, because the map swap freed MapScreen ~10 frames
# after the accept and the scenario stopped short of the battlefield's turn
# loop — a pass that told us nothing about fightability.
#
# The rewritten gate therefore proves the battle is REAL and FIGHTABLE:
#   * profile-derived hero: tutorial_battle == false, and max_health != 1000
#     (the tutorial Yang Guo's HP) — so HP comes from
#     BattleSetup.build_character(SaveManager.profile), not a hard-coded unit;
#   * the round actually starts: current_round >= 1, a non-empty turn_order
#     holding the profile hero + the five greats, phase != "IDLE",
#     active_unit_name != "";
#   * the player's turn arrives and the end-turn button is enabled
#     (phase == "PLAYER_TURN", active_unit_name == "ProgressionHero",
#     EndTurnButton.disabled == false) and one real action changes state
#     (click-move -> Player.grid_pos / moves_left changed) — the differential
#     after one real action;
#   * BOTH a WIN and a LOSE return to MAP with map state and
#     events_resolved_count intact and map_battle_id cleared.
#
# `huashan_duel` is consumed end-to-end: map.gd reads
# MapData.active_battle_id("huashan"), start_map_battle(bid) writes
# GameManager.map_battle_id, and battlefield._setup_map_battle(bid) resolves
# the opponent roster from MapBattleData. That binding is asserted at f580
# (map_battle_id == "huashan_duel") — the old gate never asserted it, because
# the id was written nowhere.
name: map_battle_node_huashan
description: '华山 is the first map node whose battle slot is live and consumable. Traveling there starts a real,
  FIGHTABLE duel: the profile-built hero (tutorial_battle == false, max_health != 1000) faces the five greats
  with the round actually started (current_round >= 1, non-empty turn_order, phase != IDLE, active_unit_name
  != ""), the player''s turn arrives with EndTurnButton enabled and one real click-move changes state, and BOTH
  a win and a loss return to MAP with map state and events_resolved_count intact and map_battle_id cleared.'
