  assert:
    GameManager.current_state: current_state == "MAP"
- at: 420
  actions:
  - move_right
- at: 430
  actions:
  - ui_accept
- at: 440
  actions: []
- at: 450
  actions:
  - ui_accept
- at: 460
  actions: []
- at: 470
  actions:
  - move_right
- at: 480
  actions:
  - move_right
- at: 490
  actions:
  - ui_accept
- at: 500
  actions: []
- at: 510
  actions:
  - ui_accept
- at: 520
  actions: []
  assert:
    MapScreen.phase: phase == "TRAVEL"
    MapScreen.current_node_id: current_node_id == "shaolin"
- at: 530
  actions:
  - move_right
- at: 535
  actions:
  - move_right
- at: 540
  actions: []
  assert:
    MapScreen.focus_id: focus_id == "huashan"
- at: 550
