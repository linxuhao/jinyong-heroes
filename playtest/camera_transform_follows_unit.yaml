# One play-test scenario. Loaded by playtest/_common.yaml's sibling scan —
# scene / actions / surface live there, this file is only the scenario.
# The basename must equal `name:`.
#
# THE CAMERA TRANSFORM NAIL (2026-08-28 camera round, "camera owns visibility").
# It exists to discriminate the ONE thing no other scenario can see: whether the
# world->screen mapping used by the health-bar follow and the camera follower's
# published `active_unit_screen_y` goes through the CANVAS transform (camera-
# aware, correct) or the FINAL transform (stretch only, no camera, the legacy
# bug). Both mappings are numerically identical while the camera never moves
# (view offset 0 at scale 1) — which is exactly why this defect survived: every
# existing assert self-consistently read green while the camera was static.
#
# This scenario walks the player to (8,2) — a ROW-2 tile — and asserts at the
# arrival frame f140, where the camera is pinned to cam_y_lo (today 260), i.e. a
# position where the camera is NOT at the board centre. At that frame the canvas
# transform gives screen_y = world_y + (viewport_half_y - camera_position.y),
# and the nail's two halves read the SAME 92 px offset:
#   active_unit_screen_y - active_unit_world_y == viewport_half_y - camera_position.y
#       (252 - 160 == 352 - 260 == 92)
#   abs(health_bar_screen_y - health_bar_world_y) > 1.0
#       (154 - 62 == 92 > 1 — the bar's screen y moved off its world y because
#        the camera moved)
# Under a WRONG final-transform implementation the active unit's screen y loses
# the camera term entirely, so the first identity reads 0 != 92 and the bar's
# screen y equals its world y (0 not > 1) -> the nail turns RED. That is its
# purpose: canvas ≡ correct (green), final ≡ bug (red).
#
# ROW-1 DEVIATION (measured, not assumed). The card's plan wanted the arrival at
# the northernmost ROW-1 tile. Row 1 is not reachable within a single player
# turn from the (7,5) spawn (move range 4; the direct row-1 column is occupied
# by Central_Divine at (7,1)), and crossing the round boundary is NOT reliable:
# West Poison's knockback deterministically moves the player from (8,2) to
# (6,2) during the round-1 enemy turns (measured: Player.grid_pos == (6,2) at
# f300..f750 in probe runs), so no row-1 arrival frame survives intact. But the
# nail needs the camera pinned to cam_y_lo, and per the derived no-blank range
# [cam_y_lo, cam_y_hi] = [260, 408] ALL of rows 1..3 pin the camera to cam_y_lo
# (row-2 feet world y = 32 + 64*2 = 160 -> clampf(160, 260, 408) = 260). Row 2
# therefore exercises the identical 92 == 92 discriminator as row 1, inside ONE
# deterministic player turn (no enemy interference), which is why the arrival is
# asserted at f140 rather than across a round boundary.
#
# RED-TO-GREEN HISTORY: the top-row sprite-offset clamp was removed 2026-08-28,
# and this nail is GREEN now. BOTH halves are invariants that hold for ANY
# sprite_top / nameplate flip and are independent of the now-deleted clamp.
# The first half uses `position` (the unit's feet); the second is a
# screen-minus-world equality that holds for any anchor/flip because camera
# motion is a pure translation. Nobody may re-derive or re-derive-away these
# numbers.
#
# BAR-HALF DECOMPOSITION (harness contract). The assert expression evaluator
# binds ONLY the keyed block's own variables — it cannot reference a value from
# another block (an attempt at `Camera.active_unit_screen_y` inside a Player
# assert fails with "Invalid named index 'Camera'"). So the bar half of the
# original invariant
#   Player.health_bar_screen_y - Camera.active_unit_screen_y ==
#       Player.health_bar_world_y - Camera.active_unit_world_y
# is decomposed into a per-block form on the Player block:
#   abs(health_bar_screen_y - health_bar_world_y) > 1.0
# This is the same equality rearranged (both sides equal viewport_half_y -
# camera_position.y at the pinned frame), expressed with only Player-block vars.
# It is a strict discriminator between the two measured values (92 under canvas,
# 0 under final) with a 1 px slack on an exact-equality intent — NOT a loosened
# threshold, exactly like the alignment pin's <= 1.0.
#
# The `camera_position.y in [camera_y_lo, camera_y_hi]` assertion is
# tautologically satisfied by the clamp formula itself (position IS the clamp to
# those bounds); its value is as a regression guard against a future edit that
# sets position without clamping — do not remove it as "redundant".
#
# PIXEL DERIVATION (constants only — TILE_SIZE 64, GRID_ORIGIN (32,32)):
#   feet world y of row 2 = 32 + 64*2 = 160
#   cam_y_lo = board.y + V.y/2 - cover_before = 0 + 352 - 92 = 260
#   viewport_half_y = 352
#   canvas screen_y = world_y + half_y - cam_y = 160 + 352 - 260 = 252
#   -> active_unit_screen_y - active_unit_world_y = 252 - 160 = 92
#   -> viewport_half_y - camera_position.y = 352 - 260 = 92
#   bar anchor world/screen (any anchor/flip): same 92 px offset, e.g. the
#   measured (154 - 62) == 92.
name: camera_transform_follows_unit
description: >-
  Canvas-vs-final transform nail. Boot to battle, walk the player to (8,2) — a
  ROW-2 tile — and at the f140 arrival frame the camera is pinned to cam_y_lo
  (not the board centre). The two clamp-state-independent translation
  invariants must hold: active_unit_screen_y - active_unit_world_y ==
  viewport_half_y - camera_position.y (today 92 == 92) and
  abs(Player.health_bar_screen_y - Player.health_bar_world_y) > 1.0 (the bar's
  screen y moved off its world y because the camera moved; 92 today). Under a
  final-transform (no-camera) mapping the active unit's screen y loses the
  camera term, so the first identity reads 0 != 92 and the bar reads 0 not > 1
  -> the nail turns RED. canvas ≡ correct, final ≡ bug. Both halves are
  camera-motion-pure-translation invariants, independent of any sprite_top /
  nameplate flip and of the now-deleted clamp, so nobody re-derives them.
  ALSO asserts follow_target_is_active == true (the
  camera follows the acting unit) and camera_position.y within
  [camera_y_lo, camera_y_hi] (a regression guard on clamping, not a
  re-derivation). ROW DEVIATION: row 1 is unreachable in one player turn and
  the round-crossing walk is broken by West Poison's knockback (measured
  (8,2)->(6,2)), so the arrival is asserted at row 2 within a single player
  turn — rows 1..3 all pin the camera to cam_y_lo, so the 92 == 92
  discriminator is identical.
timeline:
# Boot to battle exactly as portrait_grid_alignment does (7x ui_accept through
# the menu/creation flow, 3x tutorial_next), battle turn 1 settled at f40.
- {at: 3, actions: [ui_accept]}
- {at: 5, actions: [ui_accept]}
- {at: 7, actions: [ui_accept]}
- {at: 9, actions: [ui_accept]}
- {at: 11, actions: [ui_accept]}
- {at: 13, actions: [ui_accept]}
- {at: 15, actions: [ui_accept]}
- {at: 20, actions: [tutorial_next]}
- {at: 25, actions: [tutorial_next]}
- {at: 30, actions: [tutorial_next]}
# ── STATIC LEG — battle turn 1, player mid-board (camera at centre, f40). ──
- at: 40
  assert:
    Camera.follow_target_is_active: follow_target_is_active == true
    Camera.active_unit_screen_y: active_unit_screen_y - active_unit_world_y == viewport_half_y - camera_position.y
    Camera.camera_position: camera_position.y >= camera_y_lo and camera_position.y <= camera_y_hi
# ── WALK LEG: (7,5) -> (8,2), exactly 4 steps, budget 4 -> 0. ──
- at: 75
  actions: []
  clicks:
  - Player +64,-192
# ── ARRIVAL FRAME f140: player at (8,2), still round-1 player turn (no enemy
# interference), camera pinned to cam_y_lo=260 — NOT the board centre. The two
# translation invariants discriminate canvas (green) vs final (red). ──
- at: 140
  actions: []
  assert:
    Player.grid_pos: grid_pos == Vector2i(8, 2)
    Player.moves_left: moves_left == 0
    Camera.follow_target_is_active: follow_target_is_active == true
    Camera.active_unit_screen_y: active_unit_screen_y - active_unit_world_y == viewport_half_y - camera_position.y
    Player.health_bar_screen_y: abs(health_bar_screen_y - health_bar_world_y) > 1.0
    Camera.camera_position: camera_position.y >= camera_y_lo and camera_position.y <= camera_y_hi
