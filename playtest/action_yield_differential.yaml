# One play-test scenario. Loaded by playtest/_common.yaml's sibling scan —
# scene / actions / surface live there, this file is only the scenario.
# The basename must equal `name:`.
#
# ACTION YIELD DIFFERENTIAL NAIL (R3, 2026-09-01).
#
# Proves that the four monthly actions have UNIQUE silver niches:
#   - work: the ONLY action whose own silver grant is > 0 (last_action_silver > 0)
#   - practice / cultivate / travel: last_action_silver == 0 (zero-delta pin)
#
# The practice leg additionally proves the targeted-niche: last_practice_amount > 0
# and last_practice_target changed (the player chose WHICH art).
#
# The travel leg proves it routes through _on_accept branch 3 (not _apply_action):
# last_action_kind == "travel" and last_yield_text != "" (static receipt).
#
# ZERO balance literals: only sign pins (> 0, == 0) and "changed" differentials.
#
# BOOT: real-save boot (tutorial win -> creation -> sect) via the
# clicks_only_storyline grammar so the profile has 2 gongfa arts (debug_seed_save
# creates an EMPTY profile with 0 gongfa, on which the practice leg would hit the
# empty-GONGFA soft-lock exit and never apply practice — the measured red). The
# four one-month legs are then driven by keyboard (ui_accept / move_up /
# move_down). NOTE: _action_focus resets to 0 on every CARD_PICK -> ACTION_PICK
# transition, so each leg's move counts start from focus 0 (the original
# "focus persists" comments were wrong).
#
# RED-FIRST EVIDENCE — MEASURED (2026-09-02, godot_playtest_scenario on the
#   pre-fix tree where the scenario booted debug_seed_save's EMPTY profile):
#
#   failing_frame:            f280 (leg 2 PRACTICE)
#   first_failing_assert:     CultivationScreen.last_action_kind
#                             (expected "practice", observed "work" — the empty
#                             profile's GONGFA_PICK empty branch burned the month
#                             without applying practice, so last_action_kind
#                             stayed "work" from leg 1)
#   exact_error/observed:     observed last_action_kind == "work" at f280;
#                             f370 observed "practice" (leg 3 misaligned);
#                             f425 observed GONGFA_PICK with option_focus 0
#                             (expected ACTION_PICK focus 3); f460 observed
#                             "practice"; f500 observed ACTION_PICK
#   green_asserts_before_red: 9 (f130 has 5 + f170 has 2 + f200 has 2 = 9)
#
#   ROOT CAUSE (diagnosed, not a game defect): debug_seed_save creates an empty
#   profile (0 sects, 0 gongfa), so the practice leg's GONGFA_PICK is empty and
#   the soft-lock exit (proven by softlock_empty_practice_month_advances) burns
#   the month without applying practice. The scenario needs a profile WITH
#   gongfa to demonstrate the practice niche — hence the real-save boot. The
#   ACTION_PICK focus also resets to 0 each month, so the original move_up ×2
#   from a "persisted" focus 2 was wrong. No game-code change required.
name: action_yield_differential
description: >-
  Four one-month legs (work / practice / cultivate / travel) from a real-save
  profile (tutorial win -> creation -> sect, 2 gongfa). Asserts work's
  last_action_silver > 0 (unique silver niche), practice/cultivate/travel
  last_action_silver == 0 (zero-delta proof), practice last_practice_amount > 0
  + last_practice_target changed (targeted niche), travel last_action_kind ==
  "travel" + last_yield_text non-empty (routing proof). Every touched frame:
  UiOcclusionWatch clean.
scene: res://scenes/menu.tscn
timeline:
# ── BOOT: tutorial intro (7 Next clicks) -> battle seed -> overlay -> transition
- at: 40
  actions: []
  clicks:
  - Next
- at: 50
  actions: []
  clicks:
  - Next
- at: 60
  actions: []
  clicks:
  - Next
- at: 70
  actions: []
  clicks:
  - Next
- at: 80
  actions: []
  clicks:
  - Next
- at: 90
  actions: []
  clicks:
  - Next
- at: 100
  actions: []
  clicks:
  - Next
# ── TUTORIAL BATTLE (screen click-path proof + documented outcome seed) ──────
- at: 110
  actions: []
  assert:
    GameManager.current_state: current_state == "BATTLE"
- at: 115
  actions: []
  clicks:
  - AttackButton
- at: 125
  actions:
  - debug_win_tutorial
- at: 145
  actions: []
  assert:
    GameManager.current_state: current_state == "WON"
- at: 155
  actions: []
  clicks:
  - ContinueButton
# ── TRANSITION (2 pages) -> CHARACTER_CREATION (creation_done == false) ──────
- at: 175
  actions: []
  assert:
    GameManager.current_state: current_state == "TRANSITION"
- at: 185
  actions: []
  clicks:
  - NextButton
- at: 205
  actions: []
  clicks:
  - NextButton
# ── CREATION (attrs -> traits -> confirm) ─────────────────────────────────────
- at: 225
  actions: []
  assert:
    GameManager.current_state: current_state == "CHARACTER_CREATION"
- at: 235
  actions: []
  clicks:
  - AttrNextButton
- at: 255
  actions: []
  clicks:
  - TraitNextButton
- at: 275
  actions: []
  clicks:
  - ConfirmButton
# ── SECT SELECT -> shaolin (SectButton0) -> CULTIVATION (2 gongfa) ───────────
- at: 295
  actions: []
  assert:
    GameManager.current_state: current_state == "SECT_SELECTION"
- at: 305
  actions: []
  clicks:
  - SectButton0
- at: 345
  actions: []
  assert:
    GameManager.current_state: current_state == "CULTIVATION"
    SceneManager.current_scene: current_scene == "cultivation"
    CultivationScreen.phase: phase == "CARD_PICK"
    CultivationScreen.month: month == 1
    CultivationScreen.gongfa_count: gongfa_count == 2
    CultivationScreen.cursor_markers_visible: cursor_markers_visible == false
# ── LEG 1: WORK (month 1) ────────────────────────────────────────────────────
- at: 355
  actions:
  - ui_accept  # CARD_PICK -> ACTION_PICK (focus resets to 0)
- at: 365
  actions:
  - move_down  # focus 0 -> 1
- at: 370
  actions:
  - move_down  # focus 1 -> 2 (做工)
- at: 380
  actions: []
  assert:
    CultivationScreen.phase: phase == "ACTION_PICK"
    CultivationScreen.option_focus: option_focus == 2
- at: 390
  actions:
  - ui_accept  # apply work
- at: 410
  actions: []
  assert:
    CultivationScreen.last_action_kind: last_action_kind == "work"
    CultivationScreen.last_action_silver: last_action_silver > 0
    CultivationScreen.last_yield_text: last_yield_text != ""
    CultivationScreen.silver: changed
    CultivationScreen.phase: phase == "CARD_PICK"
    UiOcclusionWatch.violations: violations == 0
    UiOcclusionWatch.scan_ok: scan_ok == true
# ── LEG 2: PRACTICE (month 2) ───────────────────────────────────────────────
- at: 430
  actions:
  - ui_accept  # CARD_PICK -> ACTION_PICK (focus resets to 0)
- at: 450
  actions:
  - ui_accept  # ACTION_PICK focus 0 = 练功 -> GONGFA_PICK
- at: 470
  actions:
  - ui_accept  # GONGFA_PICK focus 0 -> apply practice
- at: 490
  actions: []
  assert:
    CultivationScreen.last_action_kind: last_action_kind == "practice"
    CultivationScreen.last_action_silver: last_action_silver == 0
    CultivationScreen.last_practice_amount: last_practice_amount > 0
    CultivationScreen.last_practice_target: last_practice_target != ""
    CultivationScreen.last_yield_text: last_yield_text != ""
    CultivationScreen.phase: phase == "CARD_PICK"
    UiOcclusionWatch.violations: violations == 0
    UiOcclusionWatch.scan_ok: scan_ok == true
# ── LEG 3: CULTIVATE (month 3) ──────────────────────────────────────────────
- at: 510
  actions:
  - ui_accept  # CARD_PICK -> ACTION_PICK (focus resets to 0)
- at: 520
  actions:
  - move_down  # focus 0 -> 1 (修习)
- at: 530
  actions:
  - ui_accept  # ACTION_PICK focus 1 = 修习 -> ATTR_PICK
- at: 550
  actions:
  - ui_accept  # ATTR_PICK focus 0 (bone) -> apply cultivate
- at: 570
  actions: []
  assert:
    CultivationScreen.last_action_kind: last_action_kind == "cultivate"
    CultivationScreen.last_action_silver: last_action_silver == 0
    CultivationScreen.last_yield_text: last_yield_text != ""
    CultivationScreen.phase: phase == "CARD_PICK"
    UiOcclusionWatch.violations: violations == 0
    UiOcclusionWatch.scan_ok: scan_ok == true
# ── LEG 4: TRAVEL (month 4) ────────────────────────────────────────────────
- at: 590
  actions:
  - ui_accept  # CARD_PICK -> ACTION_PICK (focus resets to 0)
- at: 600
  actions:
  - move_down  # focus 0 -> 1
- at: 605
  actions:
  - move_down  # focus 1 -> 2
- at: 610
  actions:
  - move_down  # focus 2 -> 3 (游历)
- at: 620
  actions: []
  assert:
    CultivationScreen.phase: phase == "ACTION_PICK"
    CultivationScreen.option_focus: option_focus == 3
- at: 630
  actions:
  - ui_accept  # ACTION_PICK focus 3 = 游历 -> EVENT phase
- at: 650
  actions: []
  assert:
    CultivationScreen.last_action_kind: last_action_kind == "travel"
    CultivationScreen.last_action_silver: last_action_silver == 0
    CultivationScreen.last_yield_text: last_yield_text != ""
    CultivationScreen.phase: phase == "EVENT"
    UiOcclusionWatch.violations: violations == 0
    UiOcclusionWatch.scan_ok: scan_ok == true
- at: 670
  actions:
  - ui_accept  # EVENT -> resolve option 0 -> _after_action -> CARD_PICK
- at: 690
  actions: []
  assert:
    CultivationScreen.phase: phase == "CARD_PICK"
    CultivationScreen.month: month == 5
