# One play-test scenario. Loaded by playtest/_common.yaml's sibling scan —
# scene / actions / surface live there, this file is only the scenario.
# The basename must equal `name:`.
#
# C3 ENDING-TIERS-DIFFERENTIATE NAIL (R3b, 2026-09-02).
#
# Proves the ending tiers actually DIVIDE on real saves — the R3 hole where all
# 8 routes landed on tier 3 (min_score 90 was reachable by the free card's
# +20/month feeding the deeds axis, and the once-per-session weak pin passed on
# any three-number text difference). C3 excludes free-card silver from the deed
# axis and re-pins the thresholds off real-save measurements; this scenario reads
# the per-ending TIER (not the text) to close the hole.
#
#   Leg A (do-nothing): seeded empty profile, 36 months of zero-yield
#     month-advance (练功 soft-lock: no unmastered art -> the month burns with
#     ZERO yield) -> map -> kunlun -> ENDING. Assert the ending TIER is < 3
#     (red-first pre-fix: the do-nothing route scored 143 -> tier 3). The 36
#     months are driven by debug_fast_forward, which on the empty profile lands
#     the same zero-yield month-advance the soft-lock exit does (no attr, no
#     mastery, no silver deed) — the do-nothing route is measured honestly.
#   Leg B (single practice route): real boot (tutorial win -> creation -> sect)
#     -> debug_fast_forward (练功 on the first unmastered art -> mastery) -> map
#     -> ENDING. Assert ending_tier_history[1] != ending_tier_history[0] (TIER
#     differential, not text) and the C1 scene nail: the 武学 (mastery) axis is
#     > 0 (red-first on the pre-C1 tree: mastery points were always 0).
#
# Every touched ENDING frame asserts UiOcclusionWatch.violations == 0 + scan_ok.
#
# ZERO balance literals: no absolute score / min_score / silver / HP — only the
# tier < 3 boundary, the tier DIFFERENTIAL across the history, and the
# mastery-axis > 0 differential.
#
# RED-FIRST EVIDENCE (measured 2026-09-02, godot_playtest_scenario on the
#   pre-C3 tree, ENDING_TIERS min_score 90/60/0 and free-card silver counted):
#   Leg A failing_frame: the do-nothing ENDING — observed tier == 3 (the free
#     card silver pushed the deed axis past 90), expected tier < 3.
#   Leg B failing_frame: the practice ENDING — ending_tier_history[1] ==
#     ending_tier_history[0] == 3 (both routes tier 3), so the TIER differential
#     was RED; and 武学 == 0 on the pre-C1 tree (mastery axis dead).
#   green_asserts_before_red: the pre-ENDING MAP/CREATION phase asserts.
name: ending_tiers_differentiate
description: >-
  Ending tiers divide on real saves. Leg A: 36 zero-yield months -> ENDING,
  assert tier < 3. Leg B: real boot -> practice fast-forward -> ENDING, assert
  ending_tier_history[1] != ending_tier_history[0] (tier differential, not text)
  and the mastery (武学) axis > 0 (C1 scene nail). Every touched ENDING frame:
  UiOcclusionWatch clean. ZERO balance literals.
scene: res://scenes/menu.tscn
timeline:
# ── LEG A (do-nothing): seed a fresh save, load it, advance 36 zero-yield months.
#    On an empty profile 练功 has no unmastered art -> the soft-lock exit burns
#    the month with ZERO yield (no attr, no mastery, no silver deed) — the only
#    legal do-nothing route. Card(button0) then 练功(button0) then the empty
#    GONGFA_PICK accept(button0) advances one month. ──────────────────────────
- at: 10
  actions:
  - debug_delete_save
- at: 40
  actions:
  - debug_seed_save
- at: 70
  actions:
  - move_down
- at: 90
  actions:
  - ui_accept
- at: 130
  actions: []
  assert:
    GameManager.current_state: current_state == "CULTIVATION"
    CultivationScreen.phase: phase == "CARD_PICK"
    CultivationScreen.month: month == 1
# ── 36 zero-yield months via debug_fast_forward (empty profile: no unmastered
#    art -> the soft-lock exit burns each month with ZERO yield). ─────────────
- at: 150
  actions:
  - debug_fast_forward
- at: 300
  actions: []
  assert:
    GameManager.current_state: current_state == "MAP"
# ── Walk to kunlun -> ENDING (the map-node click grammar) ─────────────────────
- at: 320
  actions: []
  clicks: [TravelButton0]
- at: 330
  actions: []
  clicks: [EventOptionButton0]
- at: 340
  actions: []
  clicks: [TravelButton1]
- at: 350
  actions: []
  clicks: [EventOptionButton0]
- at: 360
