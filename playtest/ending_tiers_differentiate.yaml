    SaveManager.ending_tier_history: ending_tier_history.size() == 2
    SaveManager.ending_tier_history: ending_tier_history[1] != ending_tier_history[0]
    EndingScreen.mastery_axis: mastery_axis > 0
    EndingScreen.ending_title: ending_title != ""
