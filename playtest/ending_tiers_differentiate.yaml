    UiOcclusionWatch.scan_ok: scan_ok == true
# END OF SCENARIO. The real-run nail pins the do-nothing route lands BELOW the
# top tier, the practice route lands on a DIFFERENT tier (the tier differential,
# not text), and the mastery axis is > 0 on a real-save practice route. The
# three-distinct-titles proof and the balanced-route tier-3 proof are carried
# deterministically by the GDScript instrument tests/test_action_yield_curves.gd
# (it scores the do-nothing / single-practice / balanced routes across 5 seeds
# and asserts their ENDING_TIERS rows differ and the three titles are pairwise
# distinct, reading the thresholds from MapData at runtime — no fragile
# in-session multi-ending restart is required, which the 2026-09-02 playtest
# showed cannot reliably boot a THIRD full run within the frame cap across
# differing playstyles). Deviation recorded in
# final/delivery_notes_fix_c3_ending_tiers.md.
