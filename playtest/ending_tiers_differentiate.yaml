# ── LEG A ENDING: do-nothing lands below the top tier ─────────────────────────
- at: 420
  actions: []
  assert:
    GameManager.current_state: current_state == "ENDING"
    EndingScreen.tier: tier < 3
    EndingScreen.ending_title: ending_title != ""
    SaveManager.ending_tier_history: ending_tier_history.size() == 1
    EndingScreen.evaluation_text: evaluation_text.contains("武学") == true
    UiOcclusionWatch.violations: violations == 0
    UiOcclusionWatch.scan_ok: scan_ok == true
# ── LEG B (single practice route): restart -> real boot (tutorial win ->
#    creation -> sect) -> debug_fast_forward (练功 on the first unmastered art
#    -> mastery) -> map -> kunlun -> ENDING. The restart reuses the proven
#    ending_divergent Leg B boot grammar (creation, NOT debug_seed — debug_seed
#    only fires from MENU and the restart lands in TUTORIAL). ────────────────
- at: 430
