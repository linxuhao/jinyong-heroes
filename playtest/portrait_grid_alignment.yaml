# One play-test scenario. Loaded by playtest/_common.yaml's sibling scan —
# scene / actions / surface live there, this file is only the scenario.
# The basename must equal `name:`.
#
# THE ALIGNMENT PIN (first deliverable of the "camera owns visibility" round).
# It asserts a property no assertion in this repo ever held: a portrait's drawn
# ink stands on the tile the unit occupies. ink_world_dx / ink_world_dy are
# recomputed every frame on the unit scripts STRICTLY from the already-published
# portrait_ink_rect (dx = ink centre x - unit world x, dy = ink bottom y - unit
# world y), so they measure what the sprite actually draws — not a rect re-derived
# from grid constants. Both 0.0 == "stands on its own tile"; a non-zero dy ==
# the portrait drifting off the tile it marks.
#
# RED-THEN-GREEN HISTORY (measured; recorded as history only — the top-row
# sprite-offset clamp was removed on 2026-08-28). This pin was authored while
# that clamp was live precisely so it could PROVE it can go red — a pin that is
# green while the defect exists has no value. The clamp forced top-row portraits
# down off their tiles; measured at spawn (Central_Divine (7,1) /
# East_Heretic (3,2) / West_Poison (11,2)):
#   Central_Divine.ink_world_dy  measured 124.0  -> RED
#   East_Heretic.ink_world_dy    measured  60.0  -> RED
#   West_Poison.ink_world_dy     measured  60.0  -> RED
#   Player / South_Emperor / North_Beggar dy = 0.0 -> green (rows 5 and 8, unclamped)
#   all six ink_world_dx = 0.0                       -> green (the clamp moved y only)
# plus a row-1 walk leg measured Player.ink_world_dy == 124.0 -> RED. After the
# clamp removal every one of the 24 ink lines reads <= 1.0 and the scenario is
# green (the last gate: 24/24 ink lines green). These are PRE-CLAMP-REMOVAL
# measures — history, not a live expectation — so nobody "re-fixes" a non-defect.
# NO threshold here is tunable: 1.0 px is the sub-pixel slack of an exact
# equality, not a tolerance.
#
# PIXEL DERIVATION (re-derived from constants, no number taken from any brief or
# probe note; TILE_SIZE = 64, GRID_ORIGIN = (32, 32), PORTRAIT_TEX_Y = 128 =
# texture height, PORTRAIT_TEX_X = 96 = texture width):
#   feet world y of row r        = GRID_ORIGIN.y + TILE_SIZE * r = 32 + 64 r
#   feet-anchored sprite offset  = (0, -tex.y / 2) = (0, -64)  (always)
#   ink rect                     = x in [feet.x - 48, feet.x + 48],
#                                  y in [feet.y - 128, feet.y]
#     -> ink centre x == feet.x          => dx = 0
#     -> ink bottom y == feet.y          => dy = 0
#   The offset is always the foot anchor: nothing moves a portrait off its tile,
#   so every unit's ink stands on the tile it occupies and dx = dy = 0. (While
#   the removed clamp was live it pinned the ink top to y = 92, giving the
#   measured dy = 124 / 60 above — that drift is exactly what the removal took
#   away.)
#   Row 0 and row GRID_HEIGHT-1 = 10 are the non-walkable border ring, so row 1
#   IS the northernmost legal row and the walk leg's destination row.
name: portrait_grid_alignment
description: >-
  Portrait-on-its-own-tile alignment pin (abs(ink_world_dx) <= 1.0 and
  abs(ink_world_dy) <= 1.0 for the player and all five enemies, derived from the
  published portrait_ink_rect — never a second rect computation). Static leg at
  f40 (battle turn 1, all six units at spawn). Walk leg: round 1 the player
  clicks Player +64,-192 and walks (7,5) -> (8,2) — exactly 4 steps, spending the
  whole 4-move budget — then end_turn; round 2 it clicks Player +0,-64 and walks
  (6,2) -> (6,1), a ROW-1 tile — 1 cardinal step — and the same 12 ink lines are
  re-asserted on that arrival frame together with Player.grid_pos ==
  Vector2i(6, 1) and Player.moves_left == 3.
  RED-THEN-GREEN HISTORY (pre-clamp-removal measures, recorded as history only —
  the top-row sprite-offset clamp was removed on 2026-08-28): at spawn
  Central_Divine (7,1) read dy = 124.0, East_Heretic (3,2) and West_Poison (11,2)
  read dy = 60.0, while Player (7,5) / South_Emperor (3,8) / North_Beggar (11,8)
  read dy = 0.0, and a row-1 walk leg read Player dy = 124.0; ink_world_dx was
  0.0 everywhere. After the clamp removal all 24 ink lines read <= 1.0 and the
  scenario went fully green. These numbers are the pre-removal baseline —
  history, not a live expectation — so nobody "re-fixes" a non-defect.
  DERIVATION (constants only — TILE_SIZE 64, GRID_ORIGIN (32,32), PORTRAIT_TEX_Y
  128, PORTRAIT_TEX_X 96): feet world y = 32 + 64*row; ink (always foot-anchored)
  = [feet.x-48, feet.y-128] .. [feet.x+48, feet.y] so dx = 0 and dy = 0. Route
  legality: row 0 is the non-walkable border ring, so row 1 is the northernmost
  legal row. The round-2 leg starts from the MEASURED post-enemy-turn position
  (6,2) — West Poison's knockback deterministically moves the player (8,2) ->
  (6,2) during the round-1 enemy turns (measured Player.grid_pos == (6,2) at
  f300..f750; the same fact is documented in camera_transform_follows_unit.yaml
  L29-41). From (6,2), +0,-64 resolves to (6,1) — 1 cardinal step, budget 4 -> 3.
  The click column x = 416 sits 16 px WEST of Central_Divine's ink at (7,1)
  (that ink spans x in [432,528]), so the five-step resolver's in-reach-body step
  cannot fire and the click resolves as a move to the reachable empty tile — that
  16 px margin is why the offset is +0,-64 and not a "tidier" eastward one.
  TIMING (measured, not guessed): the end_turn -> round-2 player-turn span is
  190 frames in dot_resolves_at_victim_turn_start (end_turn f60, PLAYER_TURN
  pinned at f250), 370 in cooldowns_decrement_by_round (end_turn f130, round 2 at
  f500) and 550 in qi_cost_blocks_cast_no_energy (end_turn f400, round 2 at f950).
  The largest measured span plus margin sets the round-2 click at f760 = 610
  frames after this scenario's end_turn at f150, and f750 carries an explicit
  timing pin (active_unit_name == Yang Guo) plus a ROUTE pin
  (Player.grid_pos == Vector2i(6, 2)) so a mis-chosen frame fails as a timing
  error and a changed knockback position fails loudly as a route error — fixed by
  moving a frame or re-routing, never by touching a threshold. The arrival frame
  f820 sits 60 frames after the click, the verified convention in click_move_to_tile
  for a multi-step 0.15 s/step tween walk (~9 frames/step).
  INTERLEAVED-TURN SAFETY for the locked destination (6,1) — no enemy may stand
  there when the player arrives (scripts/ai/ai_base.gd::_approach_decision walks
  the move budget and STOPS at the first tile whose Chebyshev distance to the
  player is <= attack_range; character data in scripts/battlefield.gd): Central
  Divine (7,1, range 1) is already Chebyshev-1 from (6,2) so it attacks in place
  and never steps west onto (6,1); East Heretic (3,2, range 3) attacks in place
  or stops at <= (5,2); West Poison (11,2, range 1) walks (11,2) -> (10,2) ->
  (9,2) and stops there, nowhere near row 1; South Emperor (3,8, range 2) and
  North Beggar (11,8, range 1) advance <= 3 tiles toward the player and are
  nowhere near (6,1). If Player.grid_pos at f820 is NOT (6,1), that is
  red-for-the-wrong-reason: report the five enemies' grid_pos (already
  whitelisted) and re-route this leg; do not touch the ink thresholds.
timeline:
# Boot to battle exactly as portrait_visibility.yaml does (7x ui_accept through
# the menu/creation flow, 3x tutorial_next), battle turn 1 settled at f40.
- {at: 3, actions: [ui_accept]}
- {at: 5, actions: [ui_accept]}
- {at: 7, actions: [ui_accept]}
- {at: 9, actions: [ui_accept]}
- {at: 11, actions: [ui_accept]}
- {at: 13, actions: [ui_accept]}
- {at: 15, actions: [ui_accept]}
- {at: 20, actions: [tutorial_next]}
- {at: 25, actions: [tutorial_next]}
- {at: 30, actions: [tutorial_next]}
# ── STATIC LEG — all six units at spawn, battle turn 1 settled (f40). ──
- at: 40
  assert:
    Player.ink_world_dx: abs(ink_world_dx) <= 1.0
    Player.ink_world_dy: abs(ink_world_dy) <= 1.0
    Central_Divine.ink_world_dx: abs(ink_world_dx) <= 1.0
    Central_Divine.ink_world_dy: abs(ink_world_dy) <= 1.0
    East_Heretic.ink_world_dx: abs(ink_world_dx) <= 1.0
    East_Heretic.ink_world_dy: abs(ink_world_dy) <= 1.0
    West_Poison.ink_world_dx: abs(ink_world_dx) <= 1.0
    West_Poison.ink_world_dy: abs(ink_world_dy) <= 1.0
    South_Emperor.ink_world_dx: abs(ink_world_dx) <= 1.0
    South_Emperor.ink_world_dy: abs(ink_world_dy) <= 1.0
    North_Beggar.ink_world_dx: abs(ink_world_dx) <= 1.0
    North_Beggar.ink_world_dy: abs(ink_world_dy) <= 1.0
# ── WALK LEG round 1: (7,5) -> (8,2), exactly 4 steps, budget 4 -> 0. ──
- at: 75
  actions: []
  clicks:
  - Player +64,-192
# Arrival self-confirm (also the route pin: a blocked/illegal route leaves the
# player elsewhere and this fails loudly as a timing/route error, not a tolerance).
- at: 135
  actions: []
  assert:
    Player.grid_pos: grid_pos == Vector2i(8, 2)
    Player.moves_left: moves_left == 0
- at: 150
  actions:
  - end_turn
# Round-2 player turn live? Explicit timing pin BEFORE the walk click, so a too-early
# frame reports here instead of silently no-oping the click below.
- at: 750
  actions: []
  assert:
    CombatManager.active_unit_name: active_unit_name == "Yang Guo"
    Player.grid_pos: grid_pos == Vector2i(6, 2)
# ── WALK LEG round 2: (6,2) -> (6,1) — a row-1 tile — 1 cardinal step, budget 4 -> 3. ──
- at: 760
  actions: []
  clicks:
  - Player +0,-64
# ── ARRIVAL FRAME: the same 12 ink lines re-asserted on the row-1 unit, plus
# the position/budget facts that make this frame self-verifying. ──
- at: 820
  actions: []
  assert:
    Player.grid_pos: grid_pos == Vector2i(6, 1)
    Player.moves_left: moves_left == 3
    Player.ink_world_dx: abs(ink_world_dx) <= 1.0
    Player.ink_world_dy: abs(ink_world_dy) <= 1.0
    Central_Divine.ink_world_dx: abs(ink_world_dx) <= 1.0
    Central_Divine.ink_world_dy: abs(ink_world_dy) <= 1.0
    East_Heretic.ink_world_dx: abs(ink_world_dx) <= 1.0
    East_Heretic.ink_world_dy: abs(ink_world_dy) <= 1.0
    West_Poison.ink_world_dx: abs(ink_world_dx) <= 1.0
    West_Poison.ink_world_dy: abs(ink_world_dy) <= 1.0
    South_Emperor.ink_world_dx: abs(ink_world_dx) <= 1.0
    South_Emperor.ink_world_dy: abs(ink_world_dy) <= 1.0
    North_Beggar.ink_world_dx: abs(ink_world_dx) <= 1.0
    North_Beggar.ink_world_dy: abs(ink_world_dy) <= 1.0
