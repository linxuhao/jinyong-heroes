# One play-test scenario. Loaded by playtest/_common.yaml's sibling scan —
# scene / actions / surface live there, this file is only the scenario.
# The basename must equal `name:`.
name: skill_button_visual_states
description: 'The four skill-button states render pairwise-distinct visuals: at frame 30 buttons 5-8 show the Chinese phase-locked tag 锁定 while button 1 is ready (no tag); after Heavy Edge''s cast (frame 65) button 1 shows the cooldown round number 1 and a visible overlay; at the player''s next turn start (frame 500) it is ready again — no tag, no number, no overlay. Frame numbers mirror skill_button_turn_overlay.'
timeline:
- at: 3
  actions:
  - ui_accept
- at: 5
  actions:
  - ui_accept
- at: 7
  actions:
  - ui_accept
- at: 9
  actions:
  - ui_accept
- at: 11
  actions:
  - ui_accept
- at: 13
  actions:
  - ui_accept
- at: 15
  actions:
  - ui_accept
- at: 20
  actions:
  - move_up
- at: 30
  actions: []
  assert:
    SkillButton5.state_tag_text: state_tag_text == "锁定"
    SkillButton1.state_tag_text: state_tag_text == ""
- at: 35
  actions:
  - move_up
- at: 50
  actions:
  - move_up
- at: 65
  actions:
  - skill_1
- at: 80
  actions:
  - attack_confirm
- at: 120
  actions: []
  assert:
    SkillButton1.state_text: state_text == "cooldown"
    SkillButton1.cooldown_label_text: cooldown_label_text == "1"
    SkillButton1.overlay_visible: overlay_visible == true
- at: 130
  actions:
  - end_turn
- at: 500
  actions: []
  assert:
    CombatManager.current_round: 2
    SkillButton1.state_text: state_text == "ready"
    SkillButton1.cooldown_label_text: cooldown_label_text == ""
    SkillButton1.overlay_visible: overlay_visible == false
