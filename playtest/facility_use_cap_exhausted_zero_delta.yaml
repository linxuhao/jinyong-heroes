    MapScreen.phase: phase == "TRAVEL"
    MapScreen.facility_use_count: facility_use_count == 1
# --- Entry #2: enter, use, leave (same spacing as entry #1) ---
- at: 630
  actions:
  - use_facility
- at: 650
  actions:
  - ui_accept
- at: 670
  actions: []
  assert:
    MapScreen.facility_use_count: facility_use_count == 2
    MapScreen.silver: changed
    MapScreen.attr_bone: changed
    MapScreen.facility_result_text: facility_result_text != ""
    MapScreen.silver: silver == last_use_silver
    MapScreen.attr_bone: attr_bone == last_use_attr_value
- at: 680
  actions:
  - move_down
- at: 690
  actions: []
  assert:
    MapScreen.phase: phase == "TRAVEL"
    MapScreen.facility_use_count: facility_use_count == 2
# --- Entry #3: enter, EXHAUSTED press (refused, zero delta) ---
- at: 700
  actions:
  - use_facility
- at: 710
  actions:
  - ui_accept
- at: 720
  actions: []
  assert:
    MapScreen.facility_use_count: facility_use_count == 2
    MapScreen.silver: silver == last_use_silver
    MapScreen.attr_bone: attr_bone == last_use_attr_value
    MapScreen.facility_result_text: facility_result_text != ""
