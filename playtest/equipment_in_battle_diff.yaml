# Real grant -> click equip -> real CULTIVATION encounter -> changed -> unequip -> baseline.
#
# THE ROUND'S CORE DIFFERENTIAL NAIL (jinyong-equipment-battle). Three legs
# through a REAL ENCOUNTER battle on the REAL code path:
#   GameManager.start_encounter -> battlefield._setup_encounter_battle
#   -> BattleSetup.build_character(SaveManager.profile) -> derive_stats
#   -> EquipmentData.sum_bonuses -> CharacterData.gear_* -> Player mirrors.
#
#   Leg 1: UNEQUIPPED battle — assert all four gear_*_bonus == 0, max_health > 0.
#   Leg 2: EQUIPPED battle — after a click on EquipButton0 (equip eq_sword_3,
#          tier 3 sword = ATTACK_PER_TIER 2 * 3 = +6), assert gear_attack_bonus
#          changed AND > 0 in the live battle.
#   Leg 3: UNEQUIPPED again — after a click to unequip, assert gear_attack_bonus
#          == 0 (back to baseline — reversibility through the real battle path).
#
# ROUTE = CULTIVATION ENCOUNTER, NOT the MAP/tutorial battlefield. That distinction
# is the whole fix for the prior frame-timing failure: the MAP (huashan) battle
# reuses the TUTORIAL battlefield — battlefield._ready branches to the tutorial
# path for any battle_return_state != "CULTIVATION" (battlefield.gd:69-71),
# instantiating Yang Guo (cd.max_health = 1000), NEVER the profile. Equipped gear
# flows into derived stats ONLY through the CULTIVATION encounter branch
# (battlefield.gd:69 -> _setup_encounter_battle -> :651 build_character). So the
# MAP-route scenario could not satisfy `gear_attack_bonus > 0` by ANY frame layout;
# this scenario routes through the only green-capable vehicle.
#
# REAL CODE PATH for the item: eq_sword_3 enters inventory via the
# `debug_grant_equip` cultivation action, which routes through
# EventLogic.apply_option_effects (the SAME item-grant handler every event/card
# item effect takes — merchant option_a included), never a bare profile write.
# The player equips it via a click on EquipButton0 (true hit test on the real
# control, never *_ClickTarget). The battle reads equipped gear through
# BattleSetup.build_character -> derive_stats -> EquipmentData.sum_bonuses.
#
# BOOT = the proven menu -> creation -> tutorial -> cultivation sequence
# (cultivation_changes_combat.yaml f3-f200, templated on the huashan boot).
# Lands in CULTIVATION state (needed by debug_enter_encounter, which is
# hard-gated on GameManager.current_state == "CULTIVATION").
#
# FRAME DELTAS are derived from the MEASURED cultivation_changes_combat deltas,
# generously buffered, NOT freshly measured this run (implementer probe could not
# boot the project from its working dir): debug_enter_encounter -> BATTLE measured
# ~40 frames (here 50); debug_win_tutorial -> WON measured ~20 (here 35);
# ui_accept -> CULTIVATION measured ~30 (here 45). Each assertion lands several
# frames inside a wide buffer; nothing guesses a node id or event.
#
# `changed` DIFF CAVEAT: the harness differential baseline is the FRAME-0 snapshot
# (test_playtest_contract_smoke.py: "the harness's differential baseline is the
# frame-0 snapshot"). Player.gear_attack_bonus is 0 at frame 0, so `changed` at
# Leg 3 (0 -> 0) is INEXPRESSIBLE — reversibility is instead proven by the value
# sequence across consecutive real battles: Leg 2 `> 0` (equipped) then Leg 3
# `== 0` (unequipped). This is the same reversal style roster_equip_free_action
# uses for its unequip (proven by `equipped_weapon == ""`, not `changed`).
#
# NO absolute tuned values: all gear diffs are `changed` or relational
# (`> 0`, `== 0`). The `== 0` baselines are the zero-baseline relation
# (facility_id == "" shape, sanctioned). Every battle asserts
# CombatManager.tutorial_battle == false (proves the Encounter path, not the
# tutorial path, is the vehicle).
name: equipment_in_battle_diff
description: >-
  Equipment into battle differential, proven through the REAL CULTIVATION
  encounter path (BattleSetup.build_character at battlefield.gd:651 ->
  derive_stats -> EquipmentData.sum_bonuses). eq_sword_3 is granted through
  EventLogic.apply_option_effects (the real item pipeline), equipped by clicking
  EquipButton0, then three real encounters show gear_attack_bonus 0 -> >0 (changed)
  -> 0 (reversed). CombatManager.tutorial_battle == false throughout proves the
  Encounter (not tutorial) path is the vehicle.
timeline:
