# Real grant → click equip → real encounter → changed → unequip → baseline.
#
# THE ROUND'S CORE DIFFERENTIAL NAIL (jinyong-equipment-battle). Three legs
# through a REAL encounter (battlefield.gd:651 → BattleSetup.build_character
# → derive_stats with EquipmentData.sum_bonuses):
#
#   Leg 1: UNEQUIPPED battle — assert gear_attack_bonus == 0 (and the other
#          three gear mirrors == 0), max_health > 0 (registers observation
#          for `changed`).
#   Leg 2: EQUIPPED battle — after clicking EquipButton0 through the panel,
#          re-travel to huashan; assert gear_attack_bonus changed AND > 0
#          (0 → +6 from eq_sword_3 tier 3 × ATTACK_PER_TIER 2).
#   Leg 3: UNEQUIPPED again — after clicking EquipButton0 to unequip,
#          re-travel; assert gear_attack_bonus == 0 AND changed (reversed).
#
# REAL CODE PATH: eq_sword_3 enters inventory via the merchant event
# (EventLogic.apply_option_effects, the same path as roster_panel_item_nail).
# The player equips it via a click on EquipButton0 (true hit test on the
# real control, never *_ClickTarget). The battle reads equipped gear through
# BattleSetup.build_character → derive_stats → EquipmentData.sum_bonuses.
#
# ROUTE: full boot (menu → creation → tutorial → cultivation → map) reusing
# the proven map_battle_node_huashan frame sequence. The map topology:
#   wuming_valley → luoyang → shaolin → huashan
# After each battle win (debug_win_tutorial → WON → ui_accept → MAP), the
# player is at huashan (current_node_id persists). Re-travel requires going
# to shaolin first (huashan's only neighbor), then back to huashan.
#
# MEASURED ROUTE NOTE (2026-08-31): the post-battle return node after
# debug_win_tutorial → WON → ui_accept is the MAP segment at huashan
# (battle_return_state == "MAP" set by start_map_battle, game_manager.gd:186).
# Shaolin fires its night_rain event on every arrival (events_resolved_count
# increments each pass). The re-travel steps are derived from the adjacency
# table: huashan: [shaolin], shaolin: [luoyang, huashan].
#
# NO absolute tuned values: all gear diffs are `changed` or relational
# (`> 0`, `== 0`). The `== 0` baseline is the same shape as
# facility_id == "" (zero-baseline relation, sanctioned).
name: equipment_in_battle_diff
description: >-
  Equipment in battle differential: real merchant grant of eq_sword_3,
  click-to-equip through the roster panel, three encounter legs showing
  gear_attack_bonus 0 → >0 (changed) → 0 (changed, reversed). All through
  the real code path (EventLogic → profile.inventory → profile.equipped →
  BattleSetup.build_character → derive_stats).
timeline:
# ── Leg 0: Boot to MAP (proven huashan route) ──────────────────────────
- at: 3
  actions:
  - ui_accept
- at: 5
  actions:
  - ui_accept
- at: 7
  actions:
  - ui_accept
- at: 9
  actions:
  - ui_accept
- at: 11
  actions:
  - ui_accept
- at: 13
  actions:
  - ui_accept
- at: 15
