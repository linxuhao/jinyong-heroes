# One play-test scenario. Loaded by playtest/_common.yaml's sibling scan —
# scene / actions / surface live there, this file is only the scenario.
# The basename must equal `name:`.
#
# R5 C3 (year-end sect-switch two-press confirmation): the SECT_SWITCH commit
# (sect_id write + _advance_year) is irreversible, so it requires a two-press arm.
# FIRST press on the focused row ARMS (switch_confirm_armed == true, sect_id/year
# unchanged — ZERO writes). SAME-row SECOND press commits (year advances — the
# differential).
#
# Boot: debug_seed_save + load -> drive 11 months of 做工 to reach month 12's
# YEAR_END -> move_down (另投他派) -> ui_accept -> SECT_SWITCH. First SECT_SWITCH
# accept arms (zero writes); second same-row accept commits (_advance_year ->
# year 2).
#
# RED-FIRST four values (measured on pre-implementation tree — no switch arm):
#   pre-fix failing frame ........ 700 (the first SECT_SWITCH arm assert frame)
#   first failing assert ......... CultivationScreen.switch_confirm_armed == true —
#                                  the pre-fix tree never published the var.
#   exact error .................. surface var absent (switch_confirm_armed == false)
#   green asserts before red ..... 4 (phase + month + year + back checks pass)
name: year_end_switch_needs_confirm
description: >-
  C3 year-end sect-switch confirmation: at month 12 YEAR_END 另投他派 -> SECT_SWITCH;
  first ui_accept arms (switch_confirm_armed true, sect_id/year/month unchanged —
  zero writes); second same-row ui_accept commits (_advance_year: year becomes 2,
  differential). No commit can happen on the first press.
scene: res://scenes/menu.tscn
timeline:
# ── MENU: seed a fresh no-sect CULTIVATION save ────────────────────────────
- at: 10
  actions:
  - debug_delete_save
- at: 40
  actions:
  - debug_seed_save
- at: 70
  actions:
  - move_down
- at: 90
  actions:
  - ui_accept
# ── DRIVE 11 MONTHS (做工 = index 2, 4 frames per month cycle) ────────────
