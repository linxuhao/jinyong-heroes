# One play-test scenario. Loaded by playtest/_common.yaml's sibling scan —
# scene / actions / surface live there, this file is only the scenario.
# The basename must equal `name:`.
name: map_node_event_shaolin
description: >-
  Map node entry content lives on the branch off Luoyang: arriving at 洛阳 now
  fires the deterministic merchant event on the outbound AND return legs
  (repeat-visit re-fire), 少林 still fires night_rain (EVENT phase, both options
  selectable), and resolving option A applies its effects (last_effect_types ==
  [silver, attr] structurally; bone attr diff), with the events_resolved_count
  ladder pinned +1 per resolution (1 at 洛阳 outbound, 2 at 少林, 3 at 洛阳
  return). The battle/facility gaps are declared and assertable at the node
  (entry_declared_gap_types).
