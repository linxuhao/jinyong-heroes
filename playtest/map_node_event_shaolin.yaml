# One play-test scenario. Loaded by playtest/_common.yaml's sibling scan —
# scene / actions / surface live there, this file is only the scenario.
# The basename must equal `name:`.
name: map_node_event_shaolin
description: >-
  Map node entry content lives on the branch off Luoyang: entering 少林 fires
  the deterministic night_rain event (EVENT phase, both options selectable),
  resolving option A applies its effects (last_effect_types == [silver, attr]
  structurally; bone attr diff), and the mainline nodes stay inert (declared
  slots, no event) so the spine-to-ending path is unobstructed. Travel back to
  洛阳 closes the leg with no event and no stall. The battle/facility gaps are
  declared and assertable at the node (entry_declared_gap_types).
