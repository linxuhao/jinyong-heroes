    GameManager.current_state: current_state == "CHARACTER_CREATION"
    CreationScreen.attr_cost_text: 'attr_cost_text != "" and attr_cost_text.contains(str(attr_step_cost)) == true and attr_cost_text.contains(str(points_left)) == true'
    UiOcclusionWatch.violations: violations == 0
    UiOcclusionWatch.scan_ok: scan_ok == true
- at: 320
