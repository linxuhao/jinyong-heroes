# One play-test scenario. Loaded by playtest/_common.yaml's sibling scan —
# scene / actions / surface live there, this file is only the scenario.
# The basename must equal `name:` (default scene = res://scenes/main.tscn, the
# same boot the owning scenarios proved).
#
# R5 CLOSING OCCLUSION NET — one frame per NEW surface this round added, every
# frame asserting UiOcclusionWatch.violations == 0 + scan_ok == true plus the
# surface's own non-empty/visible truth. This is the FULL-ROUND net (distinct
# from consequence_screens_occlusion_map, which is map-scoped only).
#
# Surface -> owning card -> frame (also tabulated in the delivery notes):
#   battle RosterPanel open ....... feat_c4_roster_battle_ending ... f70
#   battle PauseMenu open ......... feat_battle_pause_menu_feedback  f140
#   creation AttrCostLabel ........ feat_c1_creation_point_cost ..... f300
#   sect SectConsequenceLabel ..... feat_c1_cultivation_sect_sect ... f390
#   cultivation ConsequenceLabel CARD_PICK + CultBackButton ......... f450
#   cultivation ConsequenceLabel ACTION_PICK work ....... W2 ......... f505
#   cultivation ConsequenceLabel EVENT ....... W2 ..................... f550
#   cultivation ConsequenceLabel GONGFA_PICK ... W2 ................... f660
#   cultivation YEAR_END consequence + SECT_SWITCH arm status ...... f1160/f1250
#   map TravelHintLabel + TravelGatePanel ... covered by
#     consequence_screens_occlusion_map (map.tscn cannot be booted from the
#     main.tscn spine in one scenario — one scene per scenario harness limit).
#   ending RosterPanel open ....... covered by roster_panel_ending_open_close
#     (ending.tscn direct boot; ui_accept restarts the ending, so the spine
#     cannot pass through it).
#
# Boot grammars reused verbatim from the owning scenarios:
#   battle: battle_pause_menu_continue_zero_delta (7× ui_accept -> PLAYER_TURN);
#   win: back_button_gongfa_pick_zero_delta (AttackButton + debug_win_tutorial
#   -> ContinueButton -> 2× NextButton -> creation);
#   sect join: back_button_gongfa_pick_zero_delta (SectButton0 ×2, two-press arm);
#   monthly drive: consequence_year_end_switch (做工 4-frame month cycle).
#
# RED-FIRST: the per-frame reds were measured by the OWNING cards on the
# pre-implementation tree (each owning scenario header carries its four
# values; this card cannot revert sibling-owned code to re-measure them —
# recorded honestly in final/delivery_notes_feat_conclusion_sweep.md).
name: consequence_screens_occlusion
description: >-
  Full-round occlusion net: battle RosterPanel open, battle PauseMenu open,
  creation AttrCostLabel, sect consequence area, cultivation ConsequenceLabel in
  CARD_PICK / ACTION_PICK(work) / EVENT / GONGFA_PICK / YEAR_END, the visible
  back button, and the SECT_SWITCH arm status line — each frame with
  UiOcclusionWatch.violations == 0 and scan_ok == true.
timeline:
# ── BATTLE BOOT (battle_pause_menu_continue_zero_delta grammar) ────────────
- {at: 3, actions: [ui_accept]}
- {at: 5, actions: [ui_accept]}
- {at: 7, actions: [ui_accept]}
- {at: 9, actions: [ui_accept]}
- {at: 11, actions: [ui_accept]}
- {at: 13, actions: [ui_accept]}
- {at: 15, actions: [ui_accept]}
- at: 40
  actions: []
  assert:
    GameManager.current_state: current_state == "BATTLE"
    CombatManager.phase: phase == "PLAYER_TURN"
    RosterOpenButton.visible: visible == true
    RosterPanel.read_only: read_only == true
# ── BATTLE ROSTER PANEL OPEN (feat_c4_roster_battle_ending) ────────────────
- at: 50
  actions: []
  clicks:
  - RosterOpenButton
- at: 70
  actions: []
  assert:
    RosterPanel.is_open: is_open == true
    RosterPanel.equip_button_count: equip_button_count == 0
    HUD.roster_panel_open: roster_panel_open == true
    UiOcclusionWatch.violations: violations == 0
    UiOcclusionWatch.scan_ok: scan_ok == true
- at: 80
  actions: []
  clicks:
  - RosterCloseButton
- at: 100
  actions: []
  assert:
    RosterPanel.is_open: is_open == false
    HUD.roster_panel_open: roster_panel_open == false
# ── BATTLE PAUSE MENU OPEN (feat_battle_pause_menu_feedback) ───────────────
- at: 110
  actions: []
  clicks:
  - PauseButton
- at: 140
  actions: []
  assert:
    HUD.pause_menu_open: pause_menu_open == true
    CombatManager.is_paused: is_paused == true
    PauseContinueButton.visible: visible == true
    PauseMainMenuButton.visible: visible == true
    UiOcclusionWatch.violations: violations == 0
    UiOcclusionWatch.scan_ok: scan_ok == true
- at: 150
  actions: []
  clicks:
  - PauseContinueButton
- at: 180
  actions: []
  assert:
    HUD.pause_menu_open: pause_menu_open == false
    CombatManager.is_paused: is_paused == false
# ── WIN TUTORIAL (back_button_gongfa_pick_zero_delta grammar) ──────────────
- at: 190
  actions: []
  clicks:
  - AttackButton
- at: 200
  actions:
