# One play-test scenario. Loaded by playtest/_common.yaml's sibling scan —
# scene / actions / surface live there, this file is only the scenario.
# The basename must equal `name:`.
#
# GONGFA_PICK EMPTY KEYBOARD RETURN (2026-08-30).
#
# Keyboard twin of clicks_only_gongfa_empty_exit: it pins the KEYBOARD path out
# of the empty GONGFA_PICK dead-end. With no unmastered art, the ONLY keyboard
# exit is the `_on_accept()` empty branch (cultivation.gd:235-238) which sets
# phase = "ACTION_PICK"; the on-screen button 返回行动 is the touch twin of that
# same handler. This scenario drives the whole path by KEYBOARD (ui_accept) to
# prove the desktop path still works after the single-surface change.
#
# Boot: a direct cultivation.tscn boot leaves GameManager.current_state !=
# "CULTIVATION" (cultivation._unhandled_input gates on current_state ==
# "CULTIVATION"), so keyboard cannot drive a direct segment boot. Instead we use
# the menu_load_continues boot shape: debug_seed_save writes a FRESH no-sect
# profile (year 1 month 1, sect_id "", zero arts — _grant_year_arts grants
# nothing, so _unmastered_ids() is empty) through the real atomic pipeline,
# then the menu's 读取存档 (entry 1, focused via move_down, activated via
# ui_accept) routes DIRECTLY into CULTIVATION bypassing SEGMENT_PREDECESSORS
# (menu_load_game, game_manager.gd:334) with the freshly hosted cultivation
# scene. From CARD_PICK: ui_accept (card) -> ACTION_PICK, ui_accept (练功,
# ACTION_PICK index 0) -> empty GONGFA_PICK (single 返回行动 button), assert the
# empty state, ui_accept (the empty-branch return) -> ACTION_PICK.
#
# Frame timing follows the measured menu_load_continues boot (seed f40, load
# land CULTIVATION f120) plus cultivation keyboard spacing.
#
# ──────────────────────────────────────────────────────────────────────────────
# R5 RE-DERIVATION (2026-09-03, jinyong-nav C2 — return + zero delta)
#
# The R5 ruling (brief C2 + 90_decisions "softlock = no way out, not month
# frozen") REPLACES the burned-month semantics this nail pinned in R2. With no
# trainable gongfa the practice screen now RETURNS to ACTION_PICK WITHOUT
# advancing the month (cultivation.gd empty branch: phase="ACTION_PICK",
# _action_focus=0, status_text="功法均已大成，已返回行动重选", _sync_surface()+
# _render(), NO _after_action()). The R2 header above is preserved verbatim
# (append-only history); only the exit asserts, the button-text assert, and the
# description are re-derived. The empty-state asserts and the keyboard boot
# shape are kept byte-identical.
#
# Per-line change table (R5):
#   f170 CultOptionButton0.text: "度过本月" -> "返回行动" (a return button must not
#               call itself End-the-month; the empty-state button label changed in cultivation.gd)
#   f170 empty-state asserts (phase==GONGFA_PICK, visible, mastered_count==gongfa_count,
#               pressed_connected, cursor_markers_visible): kept verbatim
#   f200 phase: "CARD_PICK" -> "ACTION_PICK" (the return target)
#   f200 month: month == month_before_accept + 1 -> month == month_before_accept
#               (zero delta — the month is NOT burned)
#   f200 silver: NEW — silver == silver_before_accept (zero delta; silver_before_accept
#               published at _on_accept start, whitelisted in _common.yaml)
#   f200 status_text: status_text != "" kept (the player still sees why)
#   f200 cursor_markers_visible == false kept
#   keyboard boot (menu.tscn + debug_seed_save + move_down/ui_accept load, ZERO
#               debug_fast_forward): byte-identical
#
# RED-FIRST (R5, measured on the UNFIXED tree before the C2 code fix landed,
#   godot_playtest_scenario sidecar run — the unfixed tree still burned the month,
#   so the new return/zero-delta asserts fail). Four values:
#     failing_frame:            f170
#     first_failing_assert:     CultOptionButton0.text
#     exact_error/observed:     observed text == "度过本月" (unfixed tree's empty-state
#                               button still said End-the-month, not 返回行动)
#     green_asserts_before_red: 6 (f130: 5 + f170 phase assert: 1 = 6; the f170
#                               text assert is the first red — see the delivery notes)
#   NOTE: the delivery notes record the exact per-nail four-value measurements
#   from the godot_playtest_scenario runs against the unfixed tree.
name: gongfa_pick_empty_keyboard_return
description: >-
  Keyboard twin of the GONGFA_PICK empty-exit nail. Boots menu.tscn, seeds a
  fresh no-sect CULTIVATION save (debug_seed_save -> year 1 month 1, sect_id "",
  zero arts), loads it by keyboard (move_down to entry 1, ui_accept). In
  CULTIVATION: ui_accept (card) CARD_PICK -> ACTION_PICK, ui_accept (练功) ->
  empty GONGFA_PICK, assert the single 返回行动 button + RELATIVE emptiness
  (mastered_count == gongfa_count) + wired (pressed_connected truthy) + no ▶
  (cursor_markers_visible false), then ui_accept returns GONGFA_PICK ->
  ACTION_PICK with ZERO state delta (phase == "ACTION_PICK", month ==
  month_before_accept, silver == silver_before_accept, status_text != "").
  Proves the keyboard exit path survives the single-surface change.
scene: res://scenes/menu.tscn
timeline:
# ── MENU: seed a fresh no-sect CULTIVATION save ────────────────────────────
- at: 10
  actions:
  - debug_delete_save
- at: 40
  actions:
  - debug_seed_save
- at: 70
  actions:
  - move_down
- at: 90
  actions:
  - ui_accept
# ── LOAD -> CULTIVATION (no-sect fresh profile, month 1) ────────────────────
- at: 130
  actions: []
  assert:
    GameManager.current_state: current_state == "CULTIVATION"
    SceneManager.current_scene: current_scene == "cultivation"
    CultivationScreen.phase: phase == "CARD_PICK"
    CultivationScreen.month: month == 1
    CultivationScreen.cursor_markers_visible: cursor_markers_visible == false
- at: 140
  actions:
  - ui_accept
# ── CARD_PICK -> ACTION_PICK ────────────────────────────────────────────────
- at: 150
  actions:
  - ui_accept
# ── ACTION_PICK -> GONGFA_PICK (empty list, single 返回行动 button) ─────────
- at: 170
  actions: []
  assert:
    CultivationScreen.phase: phase == "GONGFA_PICK"
    CultOptionButton0.visible: visible == true
    CultOptionButton0.text: text == "返回行动"
    CultivationScreen.mastered_count: mastered_count == gongfa_count
    CultivationScreen.pressed_connected: pressed_connected["CultOptionButton0"] == true
    CultivationScreen.cursor_markers_visible: cursor_markers_visible == false
- at: 180
  actions:
  - ui_accept
# ── GONGFA_PICK empty-branch accept -> ACTION_PICK (return, zero delta) ───────
- at: 200
  actions: []
  assert:
    CultivationScreen.phase: phase == "ACTION_PICK"
    CultivationScreen.month: month == month_before_accept
    CultivationScreen.silver: silver == silver_before_accept
    CultivationScreen.status_text: status_text != ""
    CultivationScreen.cursor_markers_visible: cursor_markers_visible == false
