# One play-test scenario. Loaded by playtest/_common.yaml's sibling scan —
# scene / actions / surface live there, this file is only the scenario.
# The basename must equal `name:`.
name: fahui_du_multiplies_damage
description: >-
  发挥度 multiplies technique damage: Heavy Edge base 63 * 1.3 = round(81.9) = 82, so
  Central Divine drops to max_health - 82. UNLIKE the other scenarios, the number here
  is NOT incidental balance — the arithmetic IS the contract under test, so this
  constant is DELIBERATELY coupled to the base damage of heavy_edge in
  scripts/battlefield.gd:_create_all_skill_data. If that base changes, recompute 82
  here; do not relax the assert to make it pass. All 8 buttons also show 发挥 ×1.3.
timeline:
- at: 3
  actions:
  - ui_accept
- at: 5
  actions:
  - ui_accept
- at: 7
  actions:
  - ui_accept
- at: 9
  actions:
  - ui_accept
- at: 11
  actions:
  - ui_accept
- at: 13
  actions:
  - ui_accept
- at: 15
  actions:
  - ui_accept
- at: 30
  actions: []
  assert:
    SkillButton1.fahui_text: fahui_text.contains("发挥") == true
    SkillButton2.fahui_text: fahui_text == "发挥 ×1.3"
    SkillButton3.fahui_text: fahui_text == "发挥 ×1.3"
    SkillButton4.fahui_text: fahui_text == "发挥 ×1.3"
    SkillButton5.fahui_text: fahui_text == "发挥 ×1.3"
    SkillButton6.fahui_text: fahui_text == "发挥 ×1.3"
    SkillButton7.fahui_text: fahui_text == "发挥 ×1.3"
    SkillButton8.fahui_text: fahui_text == "发挥 ×1.3"
- at: 40
  actions:
  - move_up
- at: 55
  actions:
  - move_up
- at: 70
  actions:
  - move_up
- at: 85
  actions:
  - skill_1
- at: 100
  actions:
  - attack_confirm
- at: 140
  actions: []
  assert:
    Player.acted: changed
    Central_Divine.health: health == max_health - 82
