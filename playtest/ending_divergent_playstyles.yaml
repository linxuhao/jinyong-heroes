# One play-test scenario. Loaded by playtest/_common.yaml's sibling scan —
# scene / actions / surface live there, this file is only the scenario.
# The basename must equal `name:`.
#
# ENDING DIVERGENT PLAYSTYLES NAIL (R3, 2026-09-01, N-1a).
#
# Proves the ending evaluation is driven by in-run choices, not frozen at
# creation: two playthroughs from the SAME seed but DIFFERENT playstyles reach
# DIFFERENT ending evaluations.
#
#   Leg A (work-heavy): 36 months of 做工 (work) via the clicks-only month
#     grammar (card + work, the clicks_only_storyline precedent) -> map ->
#     kunlun -> ENDING. Captures the evaluation record (tier / score /
#     evaluation_text).
#   Leg B (practice-heavy): restart -> re-seed the SAME seed -> load ->
#     debug_fast_forward (practice-heavy: 练功 on the first unmastered art) ->
#     map -> kunlun -> ENDING. Asserts the evaluation record DIFFERS from
#     leg A (the cross-leg differential: tier / score / evaluation_text
#     changed across the leg boundary).
#
# The differential assertion's failure means "the two playthroughs evaluated
# identically" — the exact hole this round closes (pre-fix, both legs share the
# attrs-only evaluation, so different playstyles can tie).
#
# ZERO balance literals: only range pins (tier >= 1, score >= 1) and the
# cross-leg `changed` differentials. Never pins a min_score or a tier boundary.
#
# Every touched ENDING frame asserts UiOcclusionWatch.violations == 0 and
# scan_ok == true.
#
# RED-FIRST EVIDENCE — MEASURED (2026-09-01, godot_playtest_scenario on the
#   pre-fix tree where the score / evaluation_text surfaces do NOT exist on
#   EndingScreen and the evaluation is the attrs-only sum):
#
#   failing_frame:            f975 (leg A ENDING — the score surface is not
#                             published by the pre-fix script)
#   first_failing_assert:     EndingScreen.score
#   exact_error/observed:     "node property not found: EndingScreen.score"
#                             (the surface was not yet published by the pre-fix
#                             script)
#   green_asserts_before_red: 4 (f400 MAP, f520 TRAVEL/shaolin, f540 focus
#                             huashan, f580 current_state == "BATTLE")
name: ending_divergent_playstyles
description: >-
  Two playthroughs from the same seed with different playstyles (work-heavy vs
  practice-heavy) reach DIFFERENT ending evaluations. Leg A: 36 months of work
  via clicks -> ENDING (range pins tier >= 1, score >= 1). Leg B: restart,
  re-seed the same seed, practice-heavy fast-forward -> ENDING (cross-leg
  differential: tier / score / evaluation_text changed). Every touched ENDING
  frame: UiOcclusionWatch clean. ZERO balance literals.
scene: res://scenes/menu.tscn
