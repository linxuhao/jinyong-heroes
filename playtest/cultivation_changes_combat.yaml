name: cultivation_changes_combat
description: 'The round''s thesis (发挥度真算): a debug-granted 甲级 sword (独孤九剑) starts at 发挥 ×0.7 (sword D mastered only -> 缺2) and deals round(30*0.7)=21 damage; after the year-2/3 ladder practice it reaches ×0.85 (D+C mastered, B unmastered -> 缺1) and deals round(30*0.85)=26. NOTE for the reviewer: the design''s nominal battle-2 values ×1.0/30 presume the 乙 sword mastered by year 3 m9, but the implemented _add_practice targets the FIRST unmastered art in grant order, so the year-3 练功 goes to 独孤九剑 (9/10) and 乙 never masters — the achievable battle-2 values are ×0.85/26/34 (the cascade is real either way: 0.7 -> 0.85, damage 21 -> 26). PRE-C1 VALUES, SUPERSEDED 2026-09-02: after the C1 grade-vocabulary fix, mastery_points is non-zero on real profiles for the first time, so the battle-2 fahui multiplier reads ×1.1 and the partner HP lands at 27 (not ×0.85/34). The asserts below are now PROPERTY pins (fahui != ×0.7 baseline; partner health > 0 and < max_health) per the owner ruling — see final/delivery_notes_fix_combat_repin_mastery_terms.md.'
