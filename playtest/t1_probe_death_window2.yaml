# TEMPORARY PROBE #1b (scratch, deleted before delivery).
# The card's "no further input after f650" losing line does NOT kill the player:
# the player's turn is event-driven (waits forever), so enemies never act again
# and health pins at 395. This probe keeps pressing end_turn so enemy phases run
# until the player actually dies, and samples the death window. All asserts are
# always-false to force observed values into the report.
name: t1_probe_death_window2
