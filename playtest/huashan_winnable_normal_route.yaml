# One play-test scenario. Loaded by playtest/_common.yaml's sibling scan —
# scene / actions / surface live there, this file is only the scenario.
# The basename must equal `name:`.
#
# HUASHAN WINNABLE NORMAL ROUTE NAIL (R3b C5 — the round's honest-win
# flagship; rewrite of the R3 head/body-mismatched card).
#
# What this proves: on a NORMALLY-PLAYED real save (menu boot -> creation ->
# tutorial -> join 少林 -> 36 practice months), the hero reaches 华山 and WINS
# the duel with a real skill-targeted attack — no debug seed in the Huashan
# segment — and the fight is REAL (the hero is not at full HP at the win). The
# five greats' HP/damage/range/roster/AI are byte-identical (locked); the
# winnability comes from the owner-granted R3b C5 unlock (2026-09-02): the
# Huashan spawn geometry (POSITIONS) and the five greats' initiative literals
# moved under the ruling, and C1's now-live mastery terms feed attack_damage /
# move_range in derive_stats. Per-literal 改前/改后 rows: design/40_progression.md
# M3''.
#
# HEAD/BODY (the R3 defect this closes): the old card claimed a clicks-only
# card+work route but booted menu.tscn on a main.tscn keyboard timeline, stuck
# at TUTORIAL (13 reds), and its "win" was a debug victory. This timeline is
# clicks-only and boots menu.tscn, matching its title.
#
# ── RED-FIRST EVIDENCE (brief, authoritative — server frames, pre-C1 tree):
#   the old timeline never left TUTORIAL (13 assertions red); the WIN evidence
#   was the locked map_battle_node_huashan.yaml Leg E f815 debug_win_tutorial
#   (that file stays byte-untouched). On a REAL practice route (大成 6) the
#   hero entered at 18/80 HP and the five greats (95-130 HP) were unscratched.
# ── MEASURED (this step, godot_playtest_scenario on the post-unlock tree):
#   PENDING — filled from the run below.
#
# ── FRAME BUDGET (cap 2999): boot+creation+debug tutorial seed ~305 / 36
#   practice months ~345 / map walk ~95 / Huashan duel ~265 / tail ~45 =>
#   ends ~1055. The clicked tutorial skirmish was NOT taken (frame budget
#   satisfied; the sanctioned debug fallback below was exercised to keep the
#   duel budget and match the clicks_only_storyline adjudication (a)).
name: huashan_winnable_normal_route
description: >-
  A normally-played real save (menu boot -> creation -> tutorial -> join 少林 ->
  36 practice months) reaches 华山 and WINS the duel with a real skill-targeted
  attack — zero debug in the Huashan segment — asserting the WIN frame
  (current_state WON, Player.health < max_health, not full HP => the fight was
  real), the C4 boundary (the strong route survives past round 2: current_round
  >= 3 and health > 0), and the honest return to MAP (current_state MAP, scene
  map, map_battle_id cleared, current_node_id huashan) after clicking
  ContinueButton. The five greats' numbers/roster/AI are byte-identical (locked).
scene: res://scenes/menu.tscn
timeline:
