# One play-test scenario. Loaded by playtest/_common.yaml's sibling scan —
# scene / actions / surface live there, this file is only the scenario.
# The basename must equal `name:`.
#
# HUASHAN WINNABLE NORMAL ROUTE — head/body rewrite (R3b C5, 2026-09-02),
# restored under its registered name (this file's content source is commit
# 7b65843; the compact practice-leg form). Title and timeline now agree: this
# is the clicks-only, real-save, real-skill Huashan route its name advertises.
#
# WHAT THE OLD CARD GOT WRONG (the R3 defect): it booted `menu.tscn` on a
# main-timeline KEYBOARD spine (ui_accept / move_*), so it never left
# TUTORIAL — 13 asserts red — and its "WIN" came from `debug_win_tutorial`.
# This rewrite is the fix: scene and timeline share one source (menu.tscn
# boot), every action is a real GUI hit-test (`clicks:`), the Huashan duel is
# fought with real skill/target/end-turn clicks, and the WIN frame asserts the
# genuine post-battle FSM return.
#
# CLICKS-ONLY NAIL (design/90_decisions.md, 2026-08-29 / C5 ruling): zero
# keyboard actions in the whole timeline (no ui_accept, no move_*), zero
# debug_fast_forward. The ONE sanctioned non-click action is a single
# `debug_win_tutorial` in the TUTORIAL skirmish leg (f220, before the Huashan
# segment) — the documented frame-budget fallback clicks_only_storyline.yaml
# uses at f245 and the same one practice_target_receipt.yaml uses. The
# zero-debug ban covers ONLY the Huashan battle itself: the Huashan segment
# (focus huashan -> WIN -> MAP return, f1070..f2220) has ZERO debug actions
# and ZERO keyboard actions; it is fought entirely by real clicks.
#
# HONEST-LOST RULING (owner, 2026-09-03, goal-loop iteration 4; supersedes the
# WIN branch of the R3c WIN ruling by APPENDING, never editing it): the unlock
# scope landed and was insufficient — the official 2026-09-03 run measured
# 36/48. The owner re-scopes C5: the WIN is carried to the world-breadth round
# with the 36/48 baseline; the HONEST LOST pin (hero HP, round reached, which
# great, the four measured values) is R3b's C5 deliverable; no red WIN assert
# may remain in the file. The end-frame asserts pin the measured LOST state and
# the door entry is re-derived in the same change; the five greats' data and the
# unlock levers stay locked. Victory is NOT redefined as "survive two more
# rounds"; no debug victory stands in for the route; enemy data is not weakened.
#
# C4 ROUND-BOUNDARY NAIL (kept its meaning): the mid-duel frame f1600 asserts
# `CombatManager.current_round >= 3` and `Player.health > 0` as TWO keyed lines
# (the old single compound was a cross-node reference inside a node-keyed
# expression — the UX-37 expression-grammar bug class). The strong real save
# reaching round 3 without dying in round 2 — no HP literals.
#
# STATUS: honest-LOST (2026-09-03). The official run measured the decisive red
# f2100 `current_state` observed "LOST", `Player.health` observed 0,
# `ContinueButton.visible` observed false; f1200 turn predictions observed
# ENEMY_TURN / West Poison / EndTurnButton disabled; f1600 C4 boundary errored
# 'Invalid named index Player for base type Object'; f2140/f2220 MAP-return
# asserts observed LOST / battlefield / map_battle_id "huashan_duel". 35 greens
# before the decisive red. Per the dated ruling the tail is re-anchored to the
# measured LOST end state (current_state == "LOST" + health < max_health +
# RetryButton.visible) — the honest form, not a greenwash; the WIN is carried
# to the world-breadth round with the 36/48 baseline.
name: huashan_winnable_normal_route
description: >-
  Clicks-only real-save route (menu boot -> creation -> tutorial -> join 少林 ->
  36 practice months -> travel onto 华山 -> a real-skill Huashan duel). Zero
  keyboard actions, zero debug_fast_forward; the only non-click action is one
  sanctioned tutorial-skirmish debug_win_tutorial (f220) before the Huashan
  segment. The Huashan fight uses SkillButton + enemy-body + EndTurnButton
  clicks with scripted walk-up. The end-frame asserts pin the measured LOST
  end state (current_state == "LOST" with Player.health < max_health — the
  fight was real — and the RetryButton overlay), per the 2026-09-03 owner
  re-scope ruling; the WIN is carried to the world-breadth round with the
  36/48 baseline. C4 round-boundary nail current_round >= 3 and health > 0
  at f1600 (two keyed lines).
scene: res://scenes/menu.tscn
