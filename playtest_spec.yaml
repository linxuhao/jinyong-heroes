scene: "res://scenes/main.tscn"

actions:
  - move_up
  - move_down
  - move_left
  - move_right
  - skill_1
  - skill_2
  - skill_3
  - skill_4
  - skill_5
  - skill_6
  - skill_7
  - skill_8
  - basic_attack
  - end_turn
  - pause_game
  - ui_accept
  - tutorial_next

surface:
  CombatManager: [current_round, phase, active_unit_name, turn_order, turn_log, last_turn_actor]
  GameManager: [current_state]
  Player: [health, max_health, grid_pos, moves_left, moved, acted, turns_taken, selected_skill_index, skill_cooldowns, shield, status_names, energy, sprite_top]
  East_Heretic:   [health, max_health, grid_pos, turns_taken, acted, skill_cooldowns, shield, status_names, sprite_top]
  West_Poison:    [health, max_health, grid_pos, turns_taken, acted, skill_cooldowns, shield, status_names]
  South_Emperor:  [health, max_health, grid_pos, turns_taken, acted, skill_cooldowns, shield, status_names]
  North_Beggar:   [health, max_health, grid_pos, turns_taken, acted, skill_cooldowns, shield, status_names]
  Central_Divine: [health, max_health, grid_pos, turns_taken, acted, skill_cooldowns, shield, status_names, sprite_top]
  HUD: [visible, size]
  RoundIndicator: [visible, current_round, active_actor, order_names]
  SkillBar: [visible, size, global_position]
  SkillButton1: [visible, text, fahui_text, disabled]
  SkillButton2: [visible, text, fahui_text, disabled]
  SkillButton3: [visible, text, fahui_text, disabled]
  SkillButton4: [visible, text, fahui_text, disabled]
  SkillButton5: [visible, text, fahui_text, disabled]
  SkillButton6: [visible, text, fahui_text, disabled]
  SkillButton7: [visible, text, fahui_text, disabled]
  SkillButton8: [visible, text, fahui_text, disabled]
  PauseButton: [visible, global_position]
  HealthBar: [visible, global_position, size, name_text]
  Battlefield: [board_aligned]

scenarios:
  - name: round_one_snapshot_and_turn_order
    description: "Tutorial completes; round 1 snapshots initiative order with Yang Guo first."
    timeline:
      - { at: 3, actions: [ui_accept] }
      - { at: 5, actions: [ui_accept] }
      - { at: 7, actions: [ui_accept] }
      - { at: 9, actions: [ui_accept] }
      - { at: 11, actions: [ui_accept] }
      - { at: 13, actions: [ui_accept] }
      - { at: 15, actions: [ui_accept] }
      - at: 30
        actions: []
        assert:
          GameManager.current_state: "changed"
          CombatManager.current_round: 1
          CombatManager.phase: 'phase == "PLAYER_TURN"'
          CombatManager.active_unit_name: 'active_unit_name == "Yang Guo"'
          CombatManager.turn_order: 'turn_order.size() == 6 and turn_order[0] == "Yang Guo" and turn_order[1] == "East Heretic" and turn_order[2] == "Central Divine" and turn_order[3] == "South Emperor" and turn_order[4] == "North Beggar" and turn_order[5] == "West Poison"'
          Player.turns_taken: 0
          East_Heretic.turns_taken: 0
          RoundIndicator.visible: true
          RoundIndicator.current_round: 1
          RoundIndicator.active_actor: 'active_actor == "Yang Guo"'

  - name: enemy_acts_only_after_player_ends_turn
    description: "Enemies stay idle while the player's turn is open; they act only after Space (end_turn)."
    timeline:
      - { at: 3, actions: [ui_accept] }
      - { at: 5, actions: [ui_accept] }
      - { at: 7, actions: [ui_accept] }
      - { at: 9, actions: [ui_accept] }
      - { at: 11, actions: [ui_accept] }
      - { at: 13, actions: [ui_accept] }
      - { at: 15, actions: [ui_accept] }
      - { at: 20, actions: [move_up] }
      - { at: 35, actions: [move_up] }
      - { at: 50, actions: [move_up] }
      - { at: 65, actions: [basic_attack] }
      - at: 80
        actions: []
        assert:
          CombatManager.active_unit_name: 'active_unit_name == "Yang Guo"'
          East_Heretic.turns_taken: 0
          West_Poison.turns_taken: 0
          Player.acted: "changed"
          Central_Divine.health: "changed"
      - { at: 90, actions: [end_turn] }
      - at: 500
        actions: []
        assert:
          East_Heretic.turns_taken: "changed"
          CombatManager.last_turn_actor: 'last_turn_actor != "Yang Guo"'

  - name: each_unit_acts_once_per_round_initiative_order
    description: "Ending the player's turn lets all six units act exactly once, then round 2 begins with Yang Guo."
    timeline:
      - { at: 3, actions: [ui_accept] }
      - { at: 5, actions: [ui_accept] }
      - { at: 7, actions: [ui_accept] }
      - { at: 9, actions: [ui_accept] }
      - { at: 11, actions: [ui_accept] }
      - { at: 13, actions: [ui_accept] }
      - { at: 15, actions: [ui_accept] }
      - { at: 20, actions: [end_turn] }
      - at: 500
        actions: []
        assert:
          CombatManager.current_round: 2
          CombatManager.active_unit_name: 'active_unit_name == "Yang Guo"'
          CombatManager.last_turn_actor: "changed"
          Player.turns_taken: 1
          East_Heretic.turns_taken: 1
          Central_Divine.turns_taken: 1
          South_Emperor.turns_taken: 1
          North_Beggar.turns_taken: 1
          West_Poison.turns_taken: 1
          CombatManager.turn_log: 'turn_log.size() == 6 and turn_log[0] == "Yang Guo" and turn_log[5] == "West Poison"'

  - name: cooldowns_decrement_by_round
    description: "Heavy Edge (cooldown 1) is ready again at the player's NEXT turn start (decremented by round, not seconds)."
    timeline:
      - { at: 3, actions: [ui_accept] }
      - { at: 5, actions: [ui_accept] }
      - { at: 7, actions: [ui_accept] }
      - { at: 9, actions: [ui_accept] }
      - { at: 11, actions: [ui_accept] }
      - { at: 13, actions: [ui_accept] }
      - { at: 15, actions: [ui_accept] }
      - { at: 20, actions: [move_up] }
      - { at: 35, actions: [move_up] }
      - { at: 50, actions: [move_up] }
      - { at: 65, actions: [skill_1] }
      - { at: 80, actions: [basic_attack] }
      - at: 120
        actions: []
        assert:
          Player.skill_cooldowns: "changed"
          Central_Divine.health: "changed"
      - { at: 130, actions: [end_turn] }
      - at: 500
        actions: []
        assert:
          CombatManager.current_round: 2
          Player.skill_cooldowns: "skill_cooldowns[0] == 0"

  - name: dot_resolves_at_victim_turn_start
    description: "West Poison's Spirit Serpent poison ticks at the player's own turn start for round(8*1.3)=10 per tick."
    timeline:
      - { at: 3, actions: [ui_accept] }
      - { at: 5, actions: [ui_accept] }
      - { at: 7, actions: [ui_accept] }
      - { at: 9, actions: [ui_accept] }
      - { at: 11, actions: [ui_accept] }
      - { at: 13, actions: [ui_accept] }
      - { at: 15, actions: [ui_accept] }
      - { at: 20, actions: [end_turn] }
      - { at: 400, actions: [end_turn] }
      - { at: 800, actions: [end_turn] }
      - { at: 1200, actions: [end_turn] }
      - at: 1600
        actions: []
        assert:
          Player.status_names: "changed"
      - at: 2000
        actions: []
        assert:
          Player.status_names: 'status_names.has("poison") or health < 360'
          Player.health: "changed"

  - name: fahui_du_multiplies_damage
    description: "Heavy Edge 45 * 1.3 = round(58.5) = 59 damage, and all 8 buttons show OVERDRIVE x1.3."
    timeline:
      - { at: 3, actions: [ui_accept] }
      - { at: 5, actions: [ui_accept] }
      - { at: 7, actions: [ui_accept] }
      - { at: 9, actions: [ui_accept] }
      - { at: 11, actions: [ui_accept] }
      - { at: 13, actions: [ui_accept] }
      - { at: 15, actions: [ui_accept] }
      - at: 30
        actions: []
        assert:
          SkillButton1.fahui_text: 'fahui_text == "OVERDRIVE x1.3"'
          SkillButton2.fahui_text: 'fahui_text == "OVERDRIVE x1.3"'
          SkillButton3.fahui_text: 'fahui_text == "OVERDRIVE x1.3"'
          SkillButton4.fahui_text: 'fahui_text == "OVERDRIVE x1.3"'
          SkillButton5.fahui_text: 'fahui_text == "OVERDRIVE x1.3"'
          SkillButton6.fahui_text: 'fahui_text == "OVERDRIVE x1.3"'
          SkillButton7.fahui_text: 'fahui_text == "OVERDRIVE x1.3"'
          SkillButton8.fahui_text: 'fahui_text == "OVERDRIVE x1.3"'
      - { at: 40, actions: [move_up] }
      - { at: 55, actions: [move_up] }
      - { at: 70, actions: [move_up] }
      - { at: 85, actions: [skill_1] }
      - { at: 100, actions: [basic_attack] }
      - at: 140
        actions: []
        assert:
          Player.acted: "changed"
          Central_Divine.health: 'health == 71'

  - name: two_phase_skill_unlock_and_hp_gate
    description: "Rounds 1-3 lock palm arts (5-8); round 4 unlocks 5-7 while 8 stays HP-gated above 50% HP."
    timeline:
      - { at: 3, actions: [ui_accept] }
      - { at: 5, actions: [ui_accept] }
      - { at: 7, actions: [ui_accept] }
      - { at: 9, actions: [ui_accept] }
      - { at: 11, actions: [ui_accept] }
      - { at: 13, actions: [ui_accept] }
      - { at: 15, actions: [ui_accept] }
      - at: 30
        actions: []
        assert:
          SkillButton1.disabled: false
          SkillButton5.disabled: true
          SkillButton8.disabled: true
      - { at: 40, actions: [end_turn] }
      - { at: 500, actions: [end_turn] }
      - { at: 1000, actions: [end_turn] }
      - at: 1500
        actions: []
        assert:
          CombatManager.current_round: "changed"
      - at: 1600
        actions: []
        assert:
          CombatManager.current_round: 'current_round == 4'
          SkillButton5.disabled: false
          SkillButton8.disabled: true

  - name: central_divine_innate_qi_fatal_guard
    description: "Central Divine's first lethal blow keeps him at 1 HP (先天罡气); a second lethal blow kills him."
    timeline:
      - { at: 3, actions: [ui_accept] }
      - { at: 5, actions: [ui_accept] }
      - { at: 7, actions: [ui_accept] }
      - { at: 9, actions: [ui_accept] }
      - { at: 11, actions: [ui_accept] }
      - { at: 13, actions: [ui_accept] }
      - { at: 15, actions: [ui_accept] }
      - { at: 20, actions: [move_up] }
      - { at: 35, actions: [move_up] }
      - { at: 50, actions: [move_up] }
      - { at: 65, actions: [skill_1] }
      - { at: 80, actions: [basic_attack] }
      - at: 140
        actions: []
        assert:
          Central_Divine.health: 'health == 71'
      - { at: 150, actions: [end_turn] }
      - at: 550
        actions: []
        assert:
          CombatManager.current_round: 2
      - { at: 560, actions: [basic_attack] }
      - at: 600
        actions: []
        assert:
          Central_Divine.health: "changed"
      - { at: 610, actions: [basic_attack] }
      - at: 660
        actions: []
        assert:
          Central_Divine.health: "changed"

  - name: terminal_victory_8_12_rounds_hp_15_40
    description: "Full scripted battle reaches WON within 8-12 rounds with player HP 15%-40% (54-144 of 360)."
    timeline:
      - { at: 3, actions: [ui_accept] }
      - { at: 5, actions: [ui_accept] }
      - { at: 7, actions: [ui_accept] }
      - { at: 9, actions: [ui_accept] }
      - { at: 11, actions: [ui_accept] }
      - { at: 13, actions: [ui_accept] }
      - { at: 15, actions: [ui_accept] }
      - { at: 20, actions: [move_up] }
      - { at: 35, actions: [move_up] }
      - { at: 50, actions: [move_up] }
      - { at: 65, actions: [skill_1] }
      - { at: 80, actions: [basic_attack] }
      - { at: 90, actions: [end_turn] }
      - { at: 500, actions: [basic_attack] }
      - { at: 515, actions: [end_turn] }
      - { at: 900, actions: [basic_attack] }
      - { at: 915, actions: [end_turn] }
      - { at: 1300, actions: [basic_attack] }
      - { at: 1315, actions: [end_turn] }
      - { at: 1700, actions: [basic_attack] }
      - { at: 1715, actions: [end_turn] }
      - { at: 2100, actions: [basic_attack] }
      - { at: 2115, actions: [end_turn] }
      - { at: 2500, actions: [basic_attack] }
      - { at: 2515, actions: [end_turn] }
      - { at: 2900, actions: [basic_attack] }
      - { at: 2915, actions: [end_turn] }
      - { at: 3300, actions: [basic_attack] }
      - { at: 3315, actions: [end_turn] }
      - { at: 3700, actions: [basic_attack] }
      - { at: 3715, actions: [end_turn] }
      - { at: 4100, actions: [basic_attack] }
      - { at: 4115, actions: [end_turn] }
      - at: 4500
        actions: []
        assert:
          GameManager.current_state: 'current_state == "WON"'
          CombatManager.current_round: 'current_round >= 8 and current_round <= 12'
          Player.health: 'health >= 54 and health <= 144'
          Player.turns_taken: "changed"
