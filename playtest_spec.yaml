# Playtest contract — audited (step playtest_contract, A1-A19) against the
# implemented code: every surface var, state string, trait index, deck count,
# sect order, menu cell index, debug action and frame number verified matching
# (scripts/autoload/*, scripts/segments/*, scripts/data/*, scripts/ui/*,
# project.godot [input]). Zero drift found — the 12 protected battle scenarios
# are byte-unchanged except the four Chinese display-text sites and the one
# CJK-presence assertion; the 8 segment/spine scenarios are consistent with the
# runtime. Harness contract (from repo usage): scene boots main.tscn; actions
# are Input.action_press names present in project.godot [input]; assert values
# are "changed" | YAML literal | single-quoted GDScript boolean expression;
# frame cap 3000 (last assert <= 2999; spine <= 2900).
scene: "res://scenes/main.tscn"

actions:
  - move_up
  - move_down
  - move_left
  - move_right
  - skill_1
  - skill_2
  - skill_3
  - skill_4
  - skill_5
  - skill_6
  - skill_7
  - skill_8
  - basic_attack
  - end_turn
  - pause_game
  - ui_accept
  - tutorial_next
  - debug_fast_forward
  - debug_win_tutorial
  - debug_lose_tutorial

surface:
  CombatManager: [current_round, phase, active_unit_name, turn_order, turn_log, last_turn_actor, debug_await_total, debug_await_timeouts, debug_await_frames, debug_round_frame, debug_reflect_hits]
  GameManager: [current_state, end_overlay_text]
  SaveManager: [seed, last_error, slot, has_save, eco_left, eq_left, growth_left, pow_left, trait_left, art_left]
  Player: [health, max_health, grid_pos, moves_left, moved, acted, turns_taken, selected_skill_index, skill_cooldowns, shield, status_names, energy, sprite_top]
  East_Heretic:   [health, max_health, grid_pos, turns_taken, acted, skill_cooldowns, shield, status_names, sprite_top]
  West_Poison:    [health, max_health, grid_pos, turns_taken, acted, skill_cooldowns, shield, status_names]
  South_Emperor:  [health, max_health, grid_pos, turns_taken, acted, skill_cooldowns, shield, status_names]
  North_Beggar:   [health, max_health, grid_pos, turns_taken, acted, skill_cooldowns, shield, status_names]
  Central_Divine: [health, max_health, grid_pos, turns_taken, acted, skill_cooldowns, shield, status_names, sprite_top]
  HUD: [visible, size, skill8_right_edge, round_pause_overlap]
  RoundIndicator: [visible, current_round, active_actor, order_names, active_text]
  SkillBar: [visible, size, global_position]
  SkillButton1: [visible, text, fahui_text, disabled, hp_gated, state_text, cooldown_remaining, overlay_visible, state_tag_text, cooldown_label_text]
  SkillButton2: [visible, text, fahui_text, disabled, hp_gated, state_text, cooldown_remaining, overlay_visible, state_tag_text, cooldown_label_text]
  SkillButton3: [visible, text, fahui_text, disabled, hp_gated, state_text, cooldown_remaining, overlay_visible, state_tag_text, cooldown_label_text]
  SkillButton4: [visible, text, fahui_text, disabled, hp_gated, state_text, cooldown_remaining, overlay_visible, state_tag_text, cooldown_label_text]
  SkillButton5: [visible, text, fahui_text, disabled, hp_gated, state_text, cooldown_remaining, overlay_visible, state_tag_text, cooldown_label_text]
  SkillButton6: [visible, text, fahui_text, disabled, hp_gated, state_text, cooldown_remaining, overlay_visible, state_tag_text, cooldown_label_text]
  SkillButton7: [visible, text, fahui_text, disabled, hp_gated, state_text, cooldown_remaining, overlay_visible, state_tag_text, cooldown_label_text]
  SkillButton8: [visible, text, fahui_text, disabled, hp_gated, state_text, cooldown_remaining, overlay_visible, state_tag_text, cooldown_label_text]
  PauseButton: [visible, global_position]
  HealthBar: [visible, global_position, size, name_text, bar_width, follow_delta, fill_color, total_height, track_bg]
  Battlefield: [board_aligned, grid_lines_visible]
  SceneManager: [current_scene, pending_swap, last_error]
