# Every green round the DPE pipeline pushes gets exported to the web and served
# on GitHub Pages. Pages only SERVES static files — it cannot run Godot — so the
# export has to happen here.
#
# GODOT_VERSION is pinned to the engine the gates actually use (AItelier's
# Dockerfile.godot: ARG GODOT_VERSION=4.4-stable). Deploying a different engine
# than the one that compiled and play-tested the build would put something on
# the web that no gate ever verified. Bump both together or neither.
name: Deploy web build to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A round can push several times in a row; only the last one needs to reach the
# web, and Pages allows one deployment at a time anyway.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.4-stable

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot + web export template
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          wget -q "${base}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          wget -q "${base}/Godot_v${GODOT_VERSION}_export_templates.tpz" -O templates.tpz
          unzip -q templates.tpz -d /tmp/tpl
          # Godot looks for templates under <version-with-dots>/, e.g. 4.4.stable
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mv /tmp/tpl/templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION/-/.}"
          godot --version

      - name: Import resources
        # Same double --import the compile gate uses: one pass does not resolve
        # every dependency, and the export needs .godot/ populated.
        run: |
          godot --headless --path . --import || true
          godot --headless --path . --import || true

      - name: Export Web
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          ls -la build/web
          test -f build/web/index.html
          test -f build/web/index.wasm

      - name: Assert the build needs no cross-origin isolation
        # Pages cannot send COOP/COEP, so a THREADED build (which needs
        # SharedArrayBuffer) white-screens with nothing in any log.
        #
        # Grepping for SharedArrayBuffer is NOT the test — engine.js carries
        # Features.isSharedArrayBufferAvailable() in every build, guarded by
        # `if (supportsThreads)`. The first run failed on exactly that and
        # proved nothing. The signal that cannot lie is which template the
        # loader was linked against: a single-threaded export resolves
        # `godot.web.template_release.wasm32.nothreads.wasm`.
        run: |
          if ! grep -q 'nothreads\.wasm' build/web/index.js; then
            echo "::error::export is threaded — it needs SharedArrayBuffer and GitHub Pages cannot send COOP/COEP (set variant/thread_support=false in export_presets.cfg)"
            grep -o 'godot\.web\.template_release[^"]*' build/web/index.js | head -1
            exit 1
          fi
          # Belt and braces: threaded emscripten also emits a worker file.
          if [ -f build/web/index.worker.js ]; then
            echo "::error::index.worker.js present — this is a threaded build"
            exit 1
          fi
          echo "single-threaded export — servable from plain static hosting"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deploy
        uses: actions/deploy-pages@v4
